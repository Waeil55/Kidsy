<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="30%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#bdeaff"/>
      <stop offset="55%" stop-color="#5fc3f7"/>
      <stop offset="100%" stop-color="#2f9bec"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9642"/>
      <stop offset="100%" stop-color="#e6720c"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb066"/>
      <stop offset="100%" stop-color="#ff9642"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="0" y="0" width="512" height="512"  fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="392" cy="112" r="46" fill="#ffe07a"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity=".9">
    <ellipse cx="108" cy="118" rx="46" ry="24"/>
    <ellipse cx="146" cy="104" rx="34" ry="20"/>
    <ellipse cx="80" cy="104" rx="26" ry="16"/>
  </g>

  <!-- ground hill -->
  <path d="M0 392 Q160 340 256 380 T512 360 V512 H0 Z" fill="#5fd04d"/>
  <path d="M0 430 Q180 400 320 420 T512 405 V512 H0 Z" fill="#3fb832"/>

  <!-- fox mascot -->
  <g transform="translate(256 296) scale(.86)">
    <!-- ears -->
    <path d="M-96 -150 L-30 -70 L-108 -55 Z" fill="url(#ear)"/>
    <path d="M96 -150 L30 -70 L108 -55 Z" fill="url(#ear)"/>
    <path d="M-82 -128 L-46 -80 L-90 -73 Z" fill="#fff6e8"/>
    <path d="M82 -128 L46 -80 L90 -73 Z" fill="#fff6e8"/>

    <!-- head -->
    <ellipse cx="0" cy="-20" rx="128" ry="112" fill="url(#face)"/>
    <!-- cheeks / muzzle patch -->
    <path d="M0 -80 C74 -80 108 -18 78 34 C54 72 -54 72 -78 34 C-108 -18 -74 -80 0 -80 Z" fill="#fff6e8"/>

    <!-- eyes -->
    <circle cx="-40" cy="-26" r="15" fill="#2b2136"/>
    <circle cx="40" cy="-26" r="15" fill="#2b2136"/>
    <circle cx="-35" cy="-32" r="5" fill="#fff"/>
    <circle cx="45" cy="-32" r="5" fill="#fff"/>

    <!-- nose -->
    <path d="M-16 20 Q0 6 16 20 Q10 38 0 40 Q-10 38 -16 20 Z" fill="#2b2136"/>

    <!-- smile -->
    <path d="M-30 34 Q0 58 30 34" stroke="#c2520f" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- blush -->
    <circle cx="-78" cy="6" r="16" fill="#ff8fae" opacity=".7"/>
    <circle cx="78" cy="6" r="16" fill="#ff8fae" opacity=".7"/>
  </g>

  <!-- sparkle -->
  <g fill="#fff">
    <path d="M126 300 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 Z" opacity=".9"/>
  </g>
</svg>
