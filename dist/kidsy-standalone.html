I wave with my ___.",opts:["foot","arm","nose","back"],c:1},{q:"My ___ helps me think.",opts:["brain","elbow","knee","hair"],c:0}]},{title:"Context Clues: Weather",instr:"Which word fits the sentence?",qs:[{q:"The ___ shines in the day.",opts:["moon","sun","star","lamp"],c:1},{q:"Use an umbrella for ___.",opts:["sun","rain","wind","fog"],c:1},{q:"Snow is ___.",opts:["hot","cold","green","dry"],c:1},{q:"The wind ___ the leaves.",opts:["blows","eats","draws","sings"],c:0},{q:"We build a snowman in ___.",opts:["summer","winter","spring","night"],c:1},{q:"Clouds are in the ___.",opts:["ground","sky","grass","water"],c:1},{q:"I wear a coat when it is ___.",opts:["hot","warm","cold","sunny"],c:2}]},{title:"Context Clues: Food",instr:"Which word fits the sentence?",qs:[{q:"I eat cereal in a ___.",opts:["plate","bowl","fork","napkin"],c:1},{q:"Apples are a ___.",opts:["meat","fruit","candy","drink"],c:1},{q:"Ice cream is ___.",opts:["hot","spicy","cold","salty"],c:2},{q:"I drink ___ with cookies.",opts:["milk","soup","oil","jam"],c:0},{q:"Pizza is my favorite ___.",opts:["toy","food","color","pet"],c:1},{q:"I put butter on my ___.",opts:["water","toast","juice","salad"],c:1},{q:"Carrots are ___.",opts:["blue","orange","purple","black"],c:1}]},{title:"Context Clues: Home",instr:"Which word fits the sentence?",qs:[{q:"I sleep in my ___.",opts:["tub","sink","bed","chair"],c:2},{q:"I wash my hands with ___.",opts:["soap","dirt","paper","crayon"],c:0},{q:"We cook dinner in the ___.",opts:["bedroom","kitchen","garage","hall"],c:1},{q:"I watch TV in the ___.",opts:["closet","living room","bathroom","attic"],c:1},{q:"I wipe my feet on the ___.",opts:["table","mat","wall","window"],c:1},{q:"The ___ keeps food cold.",opts:["oven","fridge","sink","toaster"],c:1}]}];var wc=["The brave dog ran to the park.","A small bird sang a happy song.","We like to eat sweet red apples.","The big yellow sun is very hot.","I can see a blue fish in the water.","My mom made a big chocolate cake.","The ike very fast.","The garden has many red roses.","A whale lives in the deep ocean.","I like to help my mother cook.","The wind blew the leaves away.","Put your toys in the big box.","The orange juice is very cold.","A monkey swings from the tree.","I use a towel after my bath.","The morning sun is very bright.","We build a tall tower with blocks.","The boat floats on the river.","She lost her tooth today.","The forest is full of tall trees.","I saw a deer in the woods.","The ice cream is very cold.","We take a nap on the sofa.","The owl stays awake at night.","I can count to one hundred.","The king wears a gold crown.","We go for a walk in the woods.","The sheep has thick white wool.","I like to drink cold water.","The train goes fast on the track.","She has a smile on her face.","The bird built a nest in the tree.","We use an umbrella in the rain.","The pizza has a lot of cheese.","I can catch the ball with my hands.","The goat ate the green plants.","He found a bug on the leaf.","The plane flies high in the air.","We play in the park every day.","The star is high in the sky.","I have a red balloon in my hand.","The horse runs across the field.","Learning is a lot of fun!"];var h5=[{title:"The Three Little Pigs",instr:"Read the story and answer the questions!",passage:"Three little pigs left home. The first pig built a house of straw. The second pig built a house of sticks. The third pig worked hard and built a house of bricks. The big bad wolf came and huffed and puffed. He blew down the straw house and the stick house. But he could not blow down the brick house! The wolf ran away. The three pigs lived safely in the brick house.",qs:[{qText:"What did the first pig build his house with?",opts:["Sticks","Straw","Bricks","Mud"],c:1},{qText:"What did the third pig build his house with?",opts:["Straw","Paper","Bricks","Leaves"],c:2},{qText:"Which house could the wolf NOT blow down?",opts:["Straw house","Stick house","Brick house","All houses"],c:2},{qText:"What happened to the wolf at the end?",opts:["He came in","He ran away","He stayed","He slept"],c:1}]},{title:"Goldilocks and the Three Bears",instr:"Read Goldilocks' adventure!",passage:"Goldilocks walked through the forest and found a little cottage. Inside were three bowls of porridge. She tasted the big bowl \u2014 too hot! She tasted the medium bowl \u2014 too cold! She tasted the small bowl \u2014 just right! She ate it all up. Then she tried three chairs. The big one was too hard. The middle one was too soft. The small one was just right, but it broke! She went upstairs and tried the beds. The small bed was just right. She fell fast asleep. When the three bears came home, they found Goldilocks! She woke up and ran away.",qs:[{qText:"What was wrong with the big bowl of porridge?",opts:["Too cold","Too hot","Too salty","Too small"],c:1},{qText:"Which bowl was just right?",opts:["Big bowl","Medium bowl","Small bowl","None"],c:2},{qText:"What happened to the small chair?",opts:["It flew","It broke","It vanished","It turned red"],c:1},{qText:"What did Goldilocks do when the bears came home?",opts:["She slept","She sang","She woke up and ran away","She cooked"],c:2}]},{title:"The Magic School Bus Field Trip",instr:"Journey inside the human body!",passage:"Ms. Frizzle had the most unusual classroom in the world. One day she said, 'Today we will study the human body \u2014 from the inside!' The magic bus shrank to the size of a cell and flew into Carlos's nose. They traveled through his bloodstream, past red blood cells, past white blood cells fighting germs. They saw the heart pumping blood. They traveled through his lungs and watched air exchange happen. Finally, Carlos sneezed and the bus flew back out! 'Now THAT is how you do a field trip!' said Ms. Frizzle.",qs:[{qText:"Where did the magic bus travel?",opts:["To space","Into Carlos's nose","To the ocean","Underground"],c:1},{qText:"What were the white blood cells doing?",opts:["Sleeping","Fighting germs","Cooking","Dancing"],c:1},{qText:"What organ did they see pumping blood?",opts:["Lungs","Brain","Heart","Stomach"],c:2},{qText:"How did the bus exit the body?",opts:["Carlos sneezed","Carlos jumped","It flew backwards","It melted"],c:0}]},{title:"Desert Animals",instr:"Discover life in harsh environments!",passage:"Deserts may look empty, but they are full of life! Camels can survive without water for weeks because they store energy in their humps. The fennec fox has enormous ears that release heat to cool its body. Rattlesnakes are nocturnal \u2014 they hunt at night when it is cool. The saguaro cactus stores hundreds of gallons of water after rain. Even bacteria and tiny insects make their homes in the sand. The desert may be harsh, but life always finds a way!",qs:[{qText:"Where do camels store energy?",opts:["In their legs","In their humps","In their ears","In their tails"],c:1},{qText:"Why does the fennec fox have enormous ears?",opts:["To fly","To release heat","To swim","To dig"],c:1},{qText:"When do rattlesnakes hunt?",opts:["In the morning","At noon","At night","Never"],c:2},{qText:"What does the saguaro cactus store?",opts:["Food","Water","Sand","Rocks"],c:1}]},{title:"Charlotte's Web",instr:"A story about true friendship!",passage:"Wilbur was a small white pig who lived on a farm. He was afraid of dying. But Charlotte, a large gray spider who lived in the barn, was his best friend. Charlotte decided to help Wilbur. She spun words in her web: 'SOME PIG.' The farmer was amazed! He thought Wilbur was a very special pig. Charlotte worked all summer spinning messages. Because of her friendship, Wilbur lived a long and happy life.",qs:[{qText:"Who was Charlotte?",opts:["A pig","A duck","A gray spider","A cat"],c:2},{qText:"What words did Charlotte spin in her web first?",opts:["BEST PIG","SOME PIG","BIG PIG","RUN PIG"],c:1},{qText:"Where did Wilbur live?",opts:["In a city","On a farm","In a forest","In a zoo"],c:1},{qText:"Why did Wilbur live a long happy life?",opts:["Because of Charlotte's friendship","He ran away","He hid","He flew"],c:0}]},{title:"The Very Hungry Caterpillar",instr:"Follow the caterpillar's transformation!",passage:"On Monday, the caterpillar ate one apple. On Tuesday it ate two pears. On Wednesday it ate three plums. On Thursday it ate four strawberries. On Friday it ate five oranges. Then it built a cozy cocoon around itself. Two weeks later, a beautiful butterfly came out!",qs:[{qText:"What did the caterpillar eat on Monday?",opts:["One apple","Two pears","Three plums","Five oranges"],c:0},{qText:"How many strawberries did it eat on Thursday?",opts:["Two","Three","Four","Five"],c:2},{qText:"What did it build around itself?",opts:["A nest","A cozy cocoon","A box","A house"],c:1},{qText:"What came out two weeks later?",opts:["A bird","A bee","A beautiful butterfly","A moth"],c:2}]},{title:"Marie Curie: Pioneer of Science",instr:"Learn about the legendary scientist!",passage:"Marie Curie was born in Poland in 1867, when women were not allowed to attend university. She saved money for years, then moved to Paris to study science. She discovered two new elements: polonium (named after Poland) and radium. She was the FIRST woman to win a Nobel Prize \u2014 and then she won a SECOND one in a different field! Despite facing discrimination as a woman in science, she never gave up. Her research on radioactivity, though it eventually harmed her health, transformed modern medicine and physics.",qs:[{qText:"Where was Marie Curie born?",opts:["France","Poland","England","USA"],c:1},{qText:"What two elements did she discover?",opts:["Gold & Silver","Polonium & Radium","Oxygen & Hydrogen","Iron & Copper"],c:1},{qText:"How many Nobel Prizes did she win?",opts:["One","Two","Three","Four"],c:1},{qText:"What field did her research transform?",opts:["Music","Modern medicine and physics","Art","Sports"],c:1}]},{title:"Harriet Tubman: Hero of Freedom",instr:"The story of the Underground Railroad!",passage:"Harriet Tubman was born into slavery around 1822. She escaped north to freedom in 1849. But she couldn't stay free while others suffered. She returned south NINETEEN times, using the Underground Railroad \u2014 a secret network of safe houses and helpers \u2014 to guide over 300 enslaved people to freedom. She was never caught and never lost a passenger. During the Civil War, she served as a spy and nurse for the Union Army. She is one of the greatest heroes in American history.",qs:[{qText:"What network did Harriet Tubman use?",opts:["The Highway","The Underground Railroad","The Canal","The River"],c:1},{qText:"How many times did she return south to guide others?",opts:["Five","Ten","Nineteen","Fifty"],c:2},{qText:"How many passengers did she lose?",opts:["Ten","Five","Zero / None","Two"],c:2},{qText:"What role did she serve during the Civil War?",opts:["Captain","Spy and nurse","Chef","General"],c:1}]},{title:"The Great Treehouse Project",instr:"Read how Maya and Liam build their treehouse using Grade 3 vocabulary!",passage:"Maya and Liam received a wonderful privilege: permission to build a backyard treehouse! First, they had to calculate the cost and the amount of wood needed so they wouldn't run out. Liam didn't grumble when carrying the heavy planks. Next, their uncle arrived to help them assemble the walls and ladder. They set a specific time to meet every afternoon until it was done. When finished, their elegant hideout stood tall in the oak branches.",qs:[{qText:"What does the word 'privilege' mean in the story?",opts:["A punishment","A special benefit or honor","A loud noise","A heavy box"],c:1},{qText:"Why did they need to calculate the wood needed?",opts:["To waste time","To know the cost and not run out","To paint it red","To sleep early"],c:1},{qText:"Which word means 'to put together'?",opts:["assemble","grumble","calculate","origin"],c:0},{qText:"Fill in the blank: They set a _____ time to meet every afternoon.",opts:["fragile","snide","specific","redundant"],c:2}]},{title:"Journey to Sea Turtle Cove",instr:"Learn how young scientists study ocean life!",passage:"The young scouts traveled to the coast to research sea turtle nesting habits. Their leader explained the ancient origin of these marine reptiles, who return to the very beach where they hatched. The scouts made a solemn pledge to protect the nesting grounds from trash and bright lights. Later, in class, each student had to defend their findings using real facts and data. Because the bay had diverse species of fish and coral, everyone learned something new.",qs:[{qText:"What does the word 'research' mean?",opts:["To ignore facts","To study a specific subject","To play games","To go to sleep"],c:1},{qText:"What does the word 'pledge' mean?",opts:["A promise or agreement","A broken shell","A type of sand","A swimming fin"],c:0},{qText:"Which word means 'different from one another'?",opts:["fragile","diverse","redundant","snide"],c:1},{qText:"Fill in the blank: Each student had to _____ their findings with facts.",opts:["grumble","oppose","defend","clutch"],c:2}]},{title:"The Fragile Treasure",instr:"A story about care, honesty, and quick reflexes!",passage:"Grandma brought out a fragile porcelain vase that had been in the family for fifty years. She asked Elena to carry it to the dining table. Suddenly, the kitten darted past Elena's feet! With quick reflexes, Elena maintained a tight clutch on the handles, preventing it from falling onto the wooden floor. Her brother clapped with a cheerful gesture of relief. Grandma smiled and said, 'Thank you for your steady hands and gentle care.'",qs:[{qText:"What does the word 'fragile' mean?",opts:["Easily broken or damaged","Very heavy","Extremely loud","Bright green"],c:0},{qText:"What does 'clutch' mean in this story?",opts:["To throw far","To tightly hold something","To paint a picture","To run fast"],c:1},{qText:"What kind of 'gesture' did her brother make?",opts:["An angry shout","A movement showing relief and happiness","A snide remark","A boring lecture"],c:1},{qText:"Fill in the blank: Glass and porcelain are _____ and must be handled gently.",opts:["diverse","fragile","redundant","specific"],c:1}]},{title:"Persevering on the Mountain Trail",instr:"Discover what it takes to reach the mountain peak!",passage:"The hike up Blueberry Hill was steep and rocky. At first, Jordan wanted to oppose Mom's idea of reaching the peak because his legs felt tired. His backpack sat in a heavy heap against his shoulders. But Jordan's sister encouraged him to persevere. 'Take it one step at a time!' she urged. Jordan didn't grumble; he took a deep breath and kept hiking. When they finally stood at the summit, the view of the lake below was breathtaking. He was proud that he didn't quit.",qs:[{qText:"What does the word 'persevere' mean?",opts:["To give up quickly","To keep working even though it is difficult","To sit down and sleep","To turn back around"],c:1},{qText:"What does the word 'oppose' mean?",opts:["To agree completely","To be against something","To smile warmly","To assemble parts"],c:1},{qText:"What was the backpack described as?",opts:["A fragile feather","A heavy heap against his shoulders","An elegant ribbon","A tiny ant"],c:1},{qText:"Fill in the blank: Jordan chose to _____ and finish the difficult climb.",opts:["persevere","grumble","snide","redundant"],c:0}]},{title:"The Classroom Kindness Circle",instr:"A story about respect, listening, and good communication!",passage:"On Monday morning, Mr. Davis welcomed a new student named Sam. When Sam shyly stood in front of the room, Mr. Davis made a warm gesture inviting him to take a front seat. One student started to make a snide comment, but quickly realized it was unkind and stayed silent instead. The teacher made sure to acknowledge every student who raised a polite hand to introduce themselves. 'In our classroom,' Mr. Davis explained, 'we keep our explanations clear without repeating redundant phrases, and we treat every single person with kindness and r
