<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom animations and base styles */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .zoom-in {
            animation: zoomIn 0.3s ease-out forwards;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Hide elements by default for simple routing */
        .tab-content { display: none; }
        .tab-content.active { display: flex; }
        
        /* Modal overlay styling */
        #chat-modal {
            display: none;
            backdrop-filter: blur(4px);
        }
        #chat-modal.active {
            display: flex;
        }

        body {
            margin: 0;
            overflow: hidden; /* Prevent body scrolling */
            height: 100dvh; /* Use dynamic viewport height for mobile browsers */
            width: 100vw;
        }
    </style>
</head>
<body class="bg-slate-50 antialiased text-slate-800 flex items-center justify-center p-0 sm:p-4">

    <div class="bg-white shadow-2xl w-full max-w-2xl overflow-hidden border border-slate-200 flex flex-col h-full sm:h-[95dvh] sm:max-h-[900px] sm:rounded-3xl">
        
        <!-- Header Area -->
        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white pt-6 pb-4 px-4 sm:px-6 relative shrink-0">
            <div class="absolute top-4 right-4 bg-orange-500/90 text-white px-3 py-1 rounded-full text-sm font-bold backdrop-blur-sm flex items-center gap-1 shadow-md">
                <i data-lucide="flame" class="w-4 h-4 text-yellow-300" id="streak-icon"></i> 
                Streak: <span id="streak-counter">0</span>
            </div>
            
            <h1 class="text-3xl font-extrabold tracking-tight mb-2">VocabMaster Pro</h1>
            <p class="text-blue-200 text-sm mb-6">Endless AI Learning Experience</p>
            
            <!-- Navigation Tabs -->
            <div class="flex gap-2 bg-black/20 p-1.5 rounded-2xl backdrop-blur-md overflow-x-auto mt-4">
                <button onclick="switchTab('study')" id="tab-btn-study" class="flex-1 min-w-[100px] sm:min-w-[120px] flex items-center justify-center gap-2 py-2 px-3 sm:px-4 rounded-xl text-sm font-medium transition-all bg-white text-indigo-700 shadow-sm">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Study
                </button>
                <button onclick="switchTab('sentences')" id="tab-btn-sentences" class="flex-1 min-w-[100px] sm:min-w-[120px] flex items-center justify-center gap-2 py-2 px-3 sm:px-4 rounded-xl text-sm font-medium transition-all text-white/80 hover:bg-white/10 hover:text-white">
                    <i data-lucide="edit-3" class="w-4 h-4"></i> Missing
                </button>
                <button onclick="switchTab('quiz')" id="tab-btn-quiz" class="flex-1 min-w-[100px] sm:min-w-[120px] flex items-center justify-center gap-2 py-2 px-3 sm:px-4 rounded-xl text-sm font-medium transition-all text-white/80 hover:bg-white/10 hover:text-white">
                    <i data-lucide="brain" class="w-4 h-4"></i> Match
                </button>
            </div>
        </div>

        <div class="p-4 sm:p-6 flex-1 overflow-y-auto flex flex-col relative h-full">
            
            <!-- STUDY TAB -->
            <div id="tab-study" class="tab-content active flex-col items-center fade-in flex-1 h-full justify-between">
                
                <div class="w-full flex justify-between items-center mb-1 text-slate-400 font-semibold text-xs sm:text-sm uppercase tracking-wider shrink-0">
                    <span>Card <span id="study-current-idx">1</span> of <span id="study-total">10</span></span>
                </div>
                
                <div class="text-center w-full relative flex-1 flex flex-col justify-center min-h-0">
                    <h2 id="study-word" class="text-3xl sm:text-5xl font-black text-slate-800 mb-4 capitalize tracking-tight shrink-0"></h2>
                    <div class="bg-indigo-50/50 p-4 sm:p-6 rounded-2xl border border-indigo-100 flex flex-col items-center justify-center gap-3 relative overflow-y-auto max-h-[40vh]">
                        <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                        <p id="study-definition" class="text-base sm:text-xl text-slate-700 text-center w-full font-medium m-0"></p>
                    </div>
                     <button onclick="speakText(document.getElementById('study-definition').innerText)" class="mt-4 mx-auto text-indigo-600 hover:text-indigo-800 hover:bg-indigo-100 p-2 px-4 rounded-full transition-colors flex items-center justify-center gap-2 text-sm font-bold bg-white shadow-sm border border-indigo-50 shrink-0 w-max">
                        <i data-lucide="volume-2" class="w-4 h-4"></i> Read Definition
                    </button>
                </div>

                <div class="flex w-full gap-3 mt-4 shrink-0">
                    <button onclick="speakText(document.getElementById('study-word').innerText)" class="flex-1 flex flex-col items-center justify-center py-3 sm:py-4 rounded-xl border-2 bg-white border-blue-200 text-blue-600 hover:bg-blue-50 hover:border-blue-300 transition-all shadow-sm">
                        <i data-lucide="volume-2" class="w-5 h-5 mb-1"></i>
                        <span class="font-bold text-xs sm:text-sm">Listen</span>
                    </button>
                    <button id="btn-practice-mic" onclick="togglePracticeRecording()" class="flex-1 flex flex-col items-center justify-center py-3 sm:py-4 rounded-xl border-2 transition-all shadow-sm bg-white border-emerald-200 text-emerald-600 hover:bg-emerald-50 hover:border-emerald-300">
                        <i data-lucide="mic" id="icon-practice-mic" class="w-5 h-5 mb-1"></i>
                        <span id="text-practice-mic" class="font-bold text-xs sm:text-sm">Practice</span>
                    </button>
                </div>

                <!-- Pronunciation Feedback Container -->
                <div id="pronunciation-feedback" class="hidden w-full p-3 mt-3 rounded-xl items-center gap-3 border shrink-0">
                    <!-- Icon injected via JS -->
                    <div id="feedback-icon-container" class="shrink-0"></div>
                    <div>
                        <p id="feedback-title" class="font-bold text-sm m-0"></p>
                        <p class="text-xs opacity-80 m-0 mt-0.5">Heard: "<span id="feedback-heard"></span>"</p>
                    </div>
                </div>
            </div>

            <!-- MISSING WORD TAB (ENDLESS) -->
            <div id="tab-sentences" class="tab-content flex-col items-center w-full flex-1 h-full justify-between">
                <div class="w-full flex-1 flex flex-col justify-center min-h-0">
                    <h3 class="text-base sm:text-lg font-bold text-slate-500 mb-3 flex items-center gap-2 uppercase tracking-wider shrink-0">
                        <i data-lucide="edit-3" class="w-4 h-4"></i> Fill in the blank
                    </h3>
                    <div class="bg-amber-50 p-4 sm:p-6 rounded-2xl border border-amber-100 shadow-inner overflow-y-auto max-h-[50vh]">
                        <p id="sentence-display" class="text-lg sm:text-2xl text-slate-800 font-medium leading-relaxed m-0"></p>
                    </div>
                </div>

                <div class="w-full flex flex-col gap-3 mt-4 shrink-0">
                    <div class="relative w-full">
                        <input type="text" id="sentence-input" placeholder="Type or speak word..." class="w-full pl-4 pr-12 py-3 bg-white border-2 border-slate-200 rounded-xl focus:border-amber-400 focus:ring-0 text-base font-medium outline-none transition-colors disabled:bg-slate-50">
                        <button id="btn-sentence-mic" onclick="toggleSentenceRecording()" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 disabled:opacity-50">
                            <i data-lucide="mic" id="icon-sentence-mic" class="w-4 h-4"></i>
                        </button>
                    </div>
                    
                    <button id="btn-check-sentence" onclick="checkSentenceAnswer()" disabled class="w-full bg-amber-500 hover:bg-amber-600 disabled:bg-slate-300 text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-sm">
                        Check Answer
                    </button>
                    <button id="btn-next-sentence" onclick="generateNewSentenceQuestion()" class="hidden w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2">
                        Next <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>

                <div id="sentence-feedback" class="hidden w-full p-3 mt-3 rounded-xl flex items-center gap-3 border font-bold text-sm shrink-0">
                    <div id="sentence-feedback-icon" class="shrink-0"></div>
                    <span id="sentence-feedback-text"></span>
                </div>
            </div>

            <!-- DEFINITION MATCH TAB (ENDLESS) -->
            <div id="tab-quiz" class="tab-content flex-col w-full flex-1 h-full justify-between">
                <div class="w-full shrink-0">
                    <h3 class="text-base sm:text-lg font-bold text-slate-500 mb-3 flex items-center gap-2 uppercase tracking-wider mt-2">
                        <i data-lucide="target" class="w-4 h-4"></i> Which word is this?
                    </h3>
                    <div class="bg-emerald-50 p-4 sm:p-6 rounded-2xl border border-emerald-100 shadow-inner min-h-[100px] flex items-center justify-center text-center relative mb-4">
                        <p id="quiz-definition" class="text-lg sm:text-xl text-slate-800 font-medium italic z-10 m-0"></p>
                        <button onclick="speakText(document.getElementById('quiz-definition').innerText)" class="absolute bottom-2 right-2 text-emerald-600 hover:bg-emerald-100 p-2 rounded-full transition-colors">
                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div id="quiz-options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full flex-1 min-h-0 overflow-y-auto">
                    <!-- Options injected via JS -->
                </div>

                <div id="quiz-next-container" class="hidden flex justify-center w-full zoom-in mt-4 shrink-0">
                    <button onclick="generateNewQuizQuestion()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2 text-base">
                        Next <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Bottom Controls & Hints -->
            <div class="mt-4 border-t border-slate-100 pt-4 shrink-0 bg-white z-10 pb-2">
                
                <!-- AI Hint Display -->
                <div id="ai-hint-display" class="hidden mb-3 p-3 bg-yellow-50 border border-yellow-200 rounded-xl text-yellow-800 text-xs sm:text-sm zoom-in flex flex-row items-start gap-2">
                    <i data-lucide="lightbulb" class="shrink-0 mt-0.5 text-yellow-500 w-4 h-4"></i>
                    <p class="m-0"><strong>Hint:</strong> <span id="ai-hint-text"></span></p>
                </div>

                <div class="flex flex-row items-center justify-between gap-2">
                    <!-- Study Nav -->
                    <div id="study-nav-controls" class="flex gap-2 justify-center">
                        <button onclick="prevStudyWord()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-colors">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        </button>
                        <button onclick="nextStudyWord()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-colors">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <!-- Endless Indicator -->
                    <div id="endless-indicator" class="hidden text-slate-400 text-xs sm:text-sm font-medium flex items-center gap-1.5 justify-center">
                        <i data-lucide="infinity" class="w-4 h-4"></i> Endless
                    </div>

                    <div class="flex gap-2 justify-end flex-1">
                        <button id="btn-ai-hint" onclick="getSmartHint()" class="hidden flex items-center justify-center gap-1.5 px-3 py-2 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 rounded-xl font-bold text-xs sm:text-sm transition-colors disabled:opacity-50">
                            <i data-lucide="lightbulb" class="w-4 h-4" id="icon-hint"></i>
                            <span id="text-hint" class="hidden sm:inline">Hint</span>
                        </button>
                        
                        <button onclick="openChat()" class="flex items-center justify-center gap-1.5 bg-gradient-to-r from-violet-500 to-fuchsia-500 hover:from-violet-600 hover:to-fuchsia-600 text-white font-bold py-2 px-4 rounded-xl shadow-md transition-all text-xs sm:text-sm">
                            <i data-lucide="message-square" class="w-4 h-4"></i>
                            Tutor
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- AI Chat Modal -->
    <div id="chat-modal" class="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center sm:p-4 z-50">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-md h-[85vh] sm:h-[80vh] max-h-[700px] flex flex-col overflow-hidden zoom-in slide-up-mobile">
            <form id="chat-form" class="p-3 sm:p-4 bg-white border-t border-slate-100 flex gap-2 items-center shrink-0 pb-6 sm:pb-4">
                <button type="button" id="btn-chat-mic" onclick="toggleChatRecording()" class="p-2.5 rounded-full transition-colors flex items-center justify-center bg-slate-100 text-slate-600 hover:bg-slate-200 disabled:opacity-50">
                    <i data-lucide="mic" id="icon-chat-mic" class="w-5 h-5"></i>
                </button>
                <input type="text" id="chat-input" placeholder="Ask a question..." class="flex-1 bg-slate-100 border-transparent focus:bg-white focus:border-violet-400 focus:ring-0 rounded-full px-4 py-2.5 text-sm font-medium transition-colors outline-none border-2">
                <button type="submit" id="btn-chat-send" disabled class="bg-violet-600 hover:bg-violet-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white p-2.5 rounded-full transition-colors shadow-sm shrink-0">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        const style = document.createElement('style');
        style.innerHTML = `
            @media (max-width: 639px) {
                .slide-up-mobile {
                    animation: slideUp 0.3s ease-out forwards;
                }
            }
            @keyframes slideUp {
                from { transform: translateY(100%); }
                to { transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        // --- DATA ---
        const vocabList = [
            { 
                word: "privilege", 
                definition: "a special benefit enjoyed only under certain circumstances",
                sentences: ["Driving a car is a _________, not a right.", "Having access to clean drinking water is a _________ that many take for granted.", "It was a huge _________ to meet the famous author in person.", "As the team captain, she had the _________ of choosing the new jersey colors."]
            },
            { 
                word: "elegant", 
                definition: "something that is high quality and fancy",
                sentences: ["She wore an _________ gown to the royal ball.", "The hotel lobby was decorated in a very _________ and modern style.", "The mathematician wrote an _________ proof that was incredibly simple but brilliant.", "The swan looked incredibly _________ as it glided silently across the lake."]
            },
            { 
                word: "calculate", 
                definition: "to determine the answer",
                sentences: ["The math teacher asked us to _________ the area of the circle.", "We need to carefully _________ the total cost of the trip before we book it.", "The supercomputer can _________ complex equations in milliseconds.", "It is difficult to _________ exactly how much paint we will need for this room."]
            },
            { 
                word: "grumble", 
                definition: "to complain about something in a quiet voice",
                sentences: ["My stomach started to _________ loudly because I missed breakfast.", "The old man would always _________ about the cold weather in the winter.", "\"I hate waking up this early,\" she began to _________ under her breath.", "We could hear the thunder begin to _________ over the distant mountains."]
            },
            { 
                word: "assemble", 
                definition: "to put together",
                sentences: ["It took us three hours to _________ the new furniture we bought from the store.", "The principal asked all the students to _________ in the auditorium for a special assembly.", "We need to _________ a team of experts to tackle this difficult project.", "The factory workers can _________ thousands of cars every single day."]
            },
            { 
                word: "pledge", 
                definition: "a promise or agreement to do or not to do something",
                sentences: ["Every morning, the students stand up to say the _________ of allegiance.", "The knights made a solemn _________ of loyalty to their king.", "We ask everyone to _________ a small donation to help the local animal shelter.", "She made a personal _________ to always tell the truth, no matter what.", "I made a _________ to myself that I would exercise every day this year.", "The club members had to take a secret _________ before joining.", "He gave his _________ that he would keep the information confidential."]
            },
            { 
                word: "specific", 
                definition: "to be particular or precise",
                sentences: ["Can you be more _________ about what time we are meeting tomorrow?", "This recipe calls for a very _________ type of flour that is hard to find.", "I am looking for a _________ book about the history of the Roman Empire.", "The doctor gave me _________ instructions on how to take the new medication.", "We need a _________ tool to fix this engine problem.", "There is no _________ reason why I chose this color; I just like it.", "She gave _________ details about the suspect to the police officer."]
            },
            { 
                word: "defend", 
                definition: "to prove by giving evidence",
                sentences: ["The lawyer will fiercely _________ her client in the courtroom today.", "The army is fully prepared to _________ the borders of the country.", "You must be able to _________ your scientific argument with solid facts.", "The goalie made an amazing dive to _________ the net from the soccer ball.", "It is important to _________ your friends when people say bad things about them.", "The castle was built with high walls to _________ against enemy attacks.", "He had to _________ his thesis in front of a panel of professors."]
            },
            { 
                word: "research", 
                definition: "to study a specific subject",
                sentences: ["He needs to do a lot more _________ before writing his final science essay.", "The university scientists are conducting new _________ on a cure for the disease.", "I spent the entire afternoon doing _________ at the city library.", "Medical _________ has advanced significantly in the last ten years.", "Her _________ focuses on the behavior of deep-sea creatures.", "We need to gather more _________ before making a final decision.", "The internet makes it very easy to do _________ for school projects."]
            },
            { 
                word: "fragile", 
                definition: "easily broken or damaged",
                sentences: ["Please be extremely careful with that glass vase, it is very _________.", "The beautiful butterfly's wings look incredibly thin and _________.", "The peace agreement between the two countries is still very _________ and could break.", "These historical documents are too _________ to be handled without special gloves.", "The bird's eggs are very _________ and must be kept safe.", "Handle the package with care; the contents are highly _________.", "He felt very emotionally _________ after hearing the bad news."]
            }
        ];

        // --- STATE ---
        let studyList = [];
        let activeTab = 'study';
        let streak = 0;
        
        let studyCurrentIndex = 0;
        
        let sentenceQuestion = null;
        let sentenceResult = null; // null, 'correct', 'incorrect'
        
        let quizQuestion = null;
        let quizResult = null; // string (selected option)
        
        let chatHistory = [];
        let isChatLoading = false;
        
        let aiHint = "";
        let isLoadingHint = false;

        // --- SPEECH RECOGNITION INSTANCES ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let practiceRec = null, sentenceRec = null, chatRec = null;
        let isPracticeRecording = false, isSentenceRecording = false, isChatRecording = false;

        // --- UTILS ---
        const shuffleArray = (array) => {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        const updateStreakUI = () => {
            document.getElementById('streak-counter').innerText = streak;
            const icon = document.getElementById('streak-icon');
            if(streak > 0) {
                icon.classList.add('text-yellow-300', 'animate-pulse');
                icon.classList.remove('text-orange-200');
            } else {
                icon.classList.remove('text-yellow-300', 'animate-pulse');
                icon.classList.add('text-orange-200');
            }
        };

        const updateHintUI = () => {
            const hintDisplay = document.getElementById('ai-hint-display');
            if (aiHint) {
                hintDisplay.classList.remove('hidden');
                hintDisplay.classList.add('flex');
                document.getElementById('ai-hint-text').innerText = aiHint;
            } else {
                hintDisplay.classList.add('hidden');
                hintDisplay.classList.remove('flex');
            }

            const btnHint = document.getElementById('btn-ai-hint');
            const iconHint = document.getElementById('icon-hint');
            const textHint = document.getElementById('text-hint');

            if (isLoadingHint) {
                btnHint.disabled = true;
                iconHint.outerHTML = `<div id="icon-hint" class="animate-spin h-4 w-4 border-2 border-yellow-800 border-t-transparent rounded-full"></div>`;
            } else {
                // Re-create lucide icon element
                iconHint.outerHTML = `<i data-lucide="lightbulb" class="w-4 h-4" id="icon-hint"></i>`;
                lucide.createIcons();
                
                let disableHint = false;
                if(activeTab === 'sentences' && sentenceResult !== null) disableHint = true;
                if(activeTab === 'quiz' && quizResult !== null) disableHint = true;
                btnHint.disabled = disableHint;
            }
        };

        const resetStudyFeedback = () => {
            const fb = document.getElementById('pronunciation-feedback');
            fb.classList.add('hidden');
            fb.classList.remove('flex', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-800', 'bg-amber-50', 'border-amber-200', 'text-amber-800');
            window.speechSynthesis.cancel();
            aiHint = "";
            updateHintUI();
        };

        const getCurrentContextItem = () => {
            if (activeTab === 'sentences' && sentenceQuestion) return sentenceQuestion;
            if (activeTab === 'quiz' && quizQuestion) return quizQuestion;
            return studyList[studyCurrentIndex];
        };

        // --- TTS (NATIVE) ---
        const speakText = (text) => {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
        };

        // --- INITIALIZATION ---
        const initSpeechRecognition = () => {
            if (!SpeechRecognition) return;

            // Practice Rec
            practiceRec = new SpeechRecognition();
            practiceRec.continuous = false;
            practiceRec.interimResults = true;
            practiceRec.lang = 'en-US';
            
            practiceRec.onstart = () => {
                isPracticeRecording = true;
                const btn = document.getElementById('btn-practice-mic');
                btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-600', 'animate-pulse');
                btn.classList.remove('bg-white', 'border-emerald-200', 'text-emerald-600');
                document.getElementById('icon-practice-mic').outerHTML = `<i data-lucide="mic-off" id="icon-practice-mic" class="w-6 h-6 mb-2"></i>`;
                document.getElementById('text-practice-mic').innerText = 'Stop';
                lucide.createIcons();
                resetStudyFeedback();
            };
            
            let finalPracticeTranscript = "";
            practiceRec.onresult = (e) => {
                finalPracticeTranscript = Array.from(e.results).map(r => r[0].transcript).join('');
            };
            
            practiceRec.onend = () => {
                isPracticeRecording = false;
                const btn = document.getElementById('btn-practice-mic');
                btn.classList.remove('bg-rose-50', 'border-rose-500', 'text-rose-600', 'animate-pulse');
                btn.classList.add('bg-white', 'border-emerald-200', 'text-emerald-600');
                document.getElementById('icon-practice-mic').outerHTML = `<i data-lucide="mic" id="icon-practice-mic" class="w-6 h-6 mb-2"></i>`;
                document.getElementById('text-practice-mic').innerText = 'Practice Saying It';
                lucide.createIcons();

                if (finalPracticeTranscript && activeTab === 'study') {
                    handlePronunciationResult(finalPracticeTranscript);
                }
                finalPracticeTranscript = "";
            };
            practiceRec.onerror = () => practiceRec.stop();

            // Sentence Rec
            sentenceRec = new SpeechRecognition();
            sentenceRec.continuous = false;
            sentenceRec.interimResults = true;
            sentenceRec.lang = 'en-US';
            
            sentenceRec.onstart = () => {
                isSentenceRecording = true;
                const btn = document.getElementById('btn-sentence-mic');
                btn.classList.add('bg-rose-100', 'text-rose-600');
                btn.classList.remove('bg-slate-100', 'text-slate-500');
            };
            
            sentenceRec.onresult = (e) => {
                const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
                const input = document.getElementById('sentence-input');
                input.value = transcript;
                checkInputState(); // update check button
            };
            
            sentenceRec.onend = () => {
                isSentenceRecording = false;
                const btn = document.getElementById('btn-sentence-mic');
                btn.classList.remove('bg-rose-100', 'text-rose-600');
                btn.classList.add('bg-slate-100', 'text-slate-500');
            };
            sentenceRec.onerror = () => sentenceRec.stop();

            // Chat Rec
            chatRec = new SpeechRecognition();
            chatRec.continuous = false;
            chatRec.interimResults = true;
            chatRec.lang = 'en-US';
            
            chatRec.onstart = () => {
                isChatRecording = true;
                const btn = document.getElementById('btn-chat-mic');
                btn.classList.add('bg-rose-100', 'text-rose-600', 'animate-pulse');
                btn.classList.remove('bg-slate-100', 'text-slate-600');
                document.getElementById('icon-chat-mic').outerHTML = `<i data-lucide="mic-off" id="icon-chat-mic" class="w-5 h-5"></i>`;
                lucide.createIcons();
            };
            
            let currentChatVal = "";
            chatRec.onresult = (e) => {
                const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
                document.getElementById('chat-input').value = currentChatVal + " " + transcript;
                checkChatInputState();
            };
            
            chatRec.onend = () => {
                isChatRecording = false;
                const btn = document.getElementById('btn-chat-mic');
                btn.classList.remove('bg-rose-100', 'text-rose-600', 'animate-pulse');
                btn.classList.add('bg-slate-100', 'text-slate-600');
                document.getElementById('icon-chat-mic').outerHTML = `<i data-lucide="mic" id="icon-chat-mic" class="w-5 h-5"></i>`;
                lucide.createIcons();
                currentChatVal = document.getElementById('chat-input').value;
            };
            chatRec.onerror = () => chatRec.stop();
        };

        const togglePracticeRecording = () => isPracticeRecording ? practiceRec.stop() : practiceRec.start();
        const toggleSentenceRecording = () => isSentenceRecording ? sentenceRec.stop() : sentenceRec.start();
        const toggleChatRecording = () => isChatRecording ? chatRec.stop() : chatRec.start();

        const handlePronunciationResult = (transcript) => {
            const cleanTranscript = transcript.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim();
            const cleanTarget = studyList[studyCurrentIndex].word.toLowerCase();
            const isSuccess = cleanTranscript.includes(cleanTarget) || cleanTranscript === cleanTarget;
            
            const fb = document.getElementById('pronunciation-feedback');
            const iconContainer = document.getElementById('feedback-icon-container');
            const title = document.getElementById('feedback-title');
            
            fb.classList.remove('hidden');
            fb.classList.add('flex');
            
            if (isSuccess) {
                fb.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-800');
                iconContainer.innerHTML = `<i data-lucide="check-circle" class="w-7 h-7 text-emerald-500"></i>`;
                title.innerText = 'Perfect pronunciation!';
            } else {
                fb.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-800');
                iconContainer.innerHTML = `<i data-lucide="x-circle" class="w-7 h-7 text-amber-500"></i>`;
                title.innerText = 'Not quite right.';
            }
            document.getElementById('feedback-heard').innerText = transcript;
            lucide.createIcons();
        };

        // --- UI UPDATERS ---
        const updateStudyUI = () => {
            const word = studyList[studyCurrentIndex];
            document.getElementById('study-word').innerText = word.word;
            document.getElementById('study-definition').innerText = word.definition;
            document.getElementById('study-current-idx').innerText = studyCurrentIndex + 1;
            document.getElementById('study-total').innerText = studyList.length;
            resetStudyFeedback();
            resetChatContext();
        };

        const prevStudyWord = () => {
            studyCurrentIndex = (studyCurrentIndex - 1 + studyList.length) % studyList.length;
            updateStudyUI();
        };

        const nextStudyWord = () => {
            studyCurrentIndex = (studyCurrentIndex + 1) % studyList.length;
            updateStudyUI();
        };

        // --- SENTENCE LOGIC ---
        const generateNewSentenceQuestion = () => {
            const randomWord = vocabList[Math.floor(Math.random() * vocabList.length)];
            const randomSentence = randomWord.sentences[Math.floor(Math.random() * randomWord.sentences.length)];
            sentenceQuestion = { word: randomWord.word, sentence: randomSentence, definition: randomWord.definition };
            sentenceResult = null;
            aiHint = "";
            
            document.getElementById('sentence-input').value = "";
            document.getElementById('sentence-input').disabled = false;
            document.getElementById('btn-sentence-mic').disabled = false;
            
            document.getElementById('btn-check-sentence').classList.remove('hidden');
            document.getElementById('btn-check-sentence').disabled = true;
            document.getElementById('btn-next-sentence').classList.add('hidden');
            
            const fb = document.getElementById('sentence-feedback');
            fb.classList.add('hidden');
            fb.classList.remove('flex', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-700', 'bg-rose-50', 'border-rose-200', 'text-rose-700');

            updateHintUI();
            renderSentenceDisplay();
            resetChatContext();
        };

        const renderSentenceDisplay = () => {
            const container = document.getElementById('sentence-display');
            container.innerHTML = '';
            
            const parts = sentenceQuestion.sentence.split('_________');
            parts.forEach((part, i) => {
                container.appendChild(document.createTextNode(part));
                if (i < parts.length - 1) {
                    const span = document.createElement('span');
                    span.className = `inline-block border-b-2 w-16 sm:w-24 mx-2 transition-colors ${sentenceResult === 'correct' ? 'border-emerald-500 text-emerald-600 font-bold text-center' : 'border-slate-400'}`;
                    span.innerText = sentenceResult === 'correct' ? sentenceQuestion.word : '';
                    container.appendChild(span);
                }
            });
        };

        const checkInputState = () => {
            const val = document.getElementById('sentence-input').value.trim();
            document.getElementById('btn-check-sentence').disabled = val.length === 0;
        };

        document.getElementById('sentence-input').addEventListener('input', checkInputState);

        const checkSentenceAnswer = () => {
            const inputVal = document.getElementById('sentence-input').value.toLowerCase().trim();
            const isCorrect = inputVal === sentenceQuestion.word.toLowerCase();
            sentenceResult = isCorrect ? 'correct' : 'incorrect';
            
            if (isCorrect) streak++;
            else streak = 0;
            updateStreakUI();

            document.getElementById('sentence-input').disabled = true;
            document.getElementById('btn-sentence-mic').disabled = true;
            
            document.getElementById('btn-check-sentence').classList.add('hidden');
            document.getElementById('btn-next-sentence').classList.remove('hidden');

            const fb = document.getElementById('sentence-feedback');
            const icon = document.getElementById('sentence-feedback-icon');
            const text = document.getElementById('sentence-feedback-text');
            
            fb.classList.remove('hidden');
            fb.classList.add('flex');

            if (isCorrect) {
                fb.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
                icon.innerHTML = `<i data-lucide="check-circle" class="w-6 h-6"></i>`;
                text.innerText = 'Correct! Keep the streak going!';
            } else {
                fb.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-700');
                icon.innerHTML = `<i data-lucide="x-circle" class="w-6 h-6"></i>`;
                text.innerText = `Incorrect. The correct word is "${sentenceQuestion.word}".`;
            }
            
            lucide.createIcons();
            renderSentenceDisplay();
            updateHintUI();
        };

        // --- QUIZ LOGIC ---
        const generateNewQuizQuestion = () => {
            const randomWord = vocabList[Math.floor(Math.random() * vocabList.length)];
            let options = [randomWord.word];
            
            while (options.length < 4) {
                const randomDistractor = vocabList[Math.floor(Math.random() * vocabList.length)].word;
                if (!options.includes(randomDistractor)) {
                    options.push(randomDistractor);
                }
            }
            
            quizQuestion = { 
                word: randomWord.word, 
                definition: randomWord.definition, 
                options: shuffleArray(options) 
            };
            quizResult = null;
            aiHint = "";
            
            document.getElementById('quiz-definition').innerText = `"${quizQuestion.definition}"`;
            document.getElementById('quiz-next-container').classList.add('hidden');
            document.getElementById('quiz-next-container').classList.remove('flex');
            
            updateHintUI();
            renderQuizOptions();
            resetChatContext();
        };

        const renderQuizOptions = () => {
            const container = document.getElementById('quiz-options-container');
            container.innerHTML = '';
            
            quizQuestion.options.forEach((opt) => {
                let btnStyle = "bg-white border-2 border-slate-200 text-slate-700 hover:border-emerald-400 hover:bg-emerald-50";
                
                if (quizResult !== null) {
                    if (opt === quizQuestion.word) {
                        btnStyle = "bg-emerald-500 border-emerald-600 text-white shadow-md scale-[1.02]"; 
                    } else if (opt === quizResult && quizResult !== quizQuestion.word) {
                        btnStyle = "bg-rose-500 border-rose-600 text-white shadow-inner";
                    } else {
                        btnStyle = "bg-slate-100 border-slate-200 text-slate-400 opacity-60"; 
                    }
                }

                const btn = document.createElement('button');
                btn.className = `p-3 sm:p-4 rounded-xl text-base sm:text-lg font-bold capitalize transition-all shadow-sm ${btnStyle}`;
                btn.innerText = opt;
                btn.disabled = quizResult !== null;
                btn.onclick = () => handleQuizSelection(opt);
                container.appendChild(btn);
            });
        };

        const handleQuizSelection = (selectedWord) => {
            quizResult = selectedWord;
            const isCorrect = selectedWord === quizQuestion.word;
            
            if (isCorrect) streak++;
            else streak = 0;
            updateStreakUI();

            renderQuizOptions();
            document.getElementById('quiz-next-container').classList.remove('hidden');
            document.getElementById('quiz-next-container').classList.add('flex');
            updateHintUI();
        };

        // --- NAVIGATION ---
        const switchTab = (tabId) => {
            activeTab = tabId;
            resetStudyFeedback();
            
            // Hide all
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active', 'flex');
                el.classList.add('hidden'); // Ensure flex styles don't fight
            });
            
            // Show target
            const target = document.getElementById(`tab-${tabId}`);
            target.classList.add('active', 'flex');
            target.classList.remove('hidden');

            // Style buttons
            ['study', 'sentences', 'quiz'].forEach(id => {
                const btn = document.getElementById(`tab-btn-${id}`);
                if (id === tabId) {
                    btn.className = `flex-1 min-w-[100px] sm:min-w-[120px] flex items-center justify-center gap-2 py-2 px-3 sm:px-4 rounded-xl text-sm font-medium transition-all bg-white text-indigo-700 shadow-sm`;
                } else {
                    btn.className = `flex-1 min-w-[100px] sm:min-w-[120px] flex items-center justify-center gap-2 py-2 px-3 sm:px-4 rounded-xl text-sm font-medium transition-all text-white/80 hover:bg-white/10 hover:text-white`;
                }
            });

            // Bottom Nav Visibility
            if (tabId === 'study') {
                document.getElementById('study-nav-controls').classList.remove('hidden');
                document.getElementById('study-nav-controls').classList.add('flex');
                document.getElementById('endless-indicator').classList.add('hidden');
                document.getElementById('endless-indicator').classList.remove('flex');
                document.getElementById('btn-ai-hint').classList.add('hidden');
                document.getElementById('btn-ai-hint').classList.remove('flex');
            } else {
                document.getElementById('study-nav-controls').classList.add('hidden');
                document.getElementById('study-nav-controls').classList.remove('flex');
                document.getElementById('endless-indicator').classList.remove('hidden');
                document.getElementById('endless-indicator').classList.add('flex');
                document.getElementById('btn-ai-hint').classList.remove('hidden');
                document.getElementById('btn-ai-hint').classList.add('flex', 'sm:flex-none');
            }
            
            resetChatContext();
        };

        // --- AI INTEGRATIONS ---
        const getSmartHint = async () => {
            isLoadingHint = true;
            updateHintUI();
            
            const contextItem = getCurrentContextItem();
            const contextText = activeTab === 'sentences' ? contextItem.sentence : (activeTab === 'quiz' ? contextItem.definition : contextItem.definition);
            
            try {
                const payload = {
                    contents: [{ role: "user", parts: [{ text: `Give me a clever, 1-sentence hint for the word "${contextItem.word}" without actually using the word itself. The current context is: ${contextText}` }] }],
                };
                // API Key is intentionally left blank for Canvas environment
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                const result = await response.json();
                aiHint = result.candidates?.[0]?.content?.parts?.[0]?.text || "No hint available right now.";
            } catch (error) {
                aiHint = "Could not load hint.";
            } finally {
                isLoadingHint = false;
                updateHintUI();
            }
        };

        const resetChatContext = () => {
            const contextItem = getCurrentContextItem();
            if(!contextItem) return;
            document.getElementById('chat-context-word').innerText = contextItem.word;
            chatHistory = [{
                role: "model",
                parts: [{ text: `Hi! I see you are looking at the word **${contextItem.word}**. Do you need an example sentence, synonyms, or help understanding it?` }]
            }];
            renderChatMessages();
        };

        const renderChatMessages = () => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            
            chatHistory.forEach(msg => {
                const isUser = msg.role === 'user';
                const text = msg.parts[0].text;
                
                // Simple markdown bold parsing
                const htmlText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                const wrapper = document.createElement('div');
                wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
                
                const bubble = document.createElement('div');
                bubble.className = `max-w-[85%] p-4 rounded-2xl text-[15px] shadow-sm leading-relaxed ${
                    isUser ? 'bg-violet-500 text-white rounded-tr-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-tl-sm'
                }`;
                bubble.innerHTML = htmlText;
                
                wrapper.appendChild(bubble);
                container.appendChild(wrapper);
            });

            if (isChatLoading) {
                const loadingWrapper = document.createElement('div');
                loadingWrapper.className = 'flex justify-start';
                loadingWrapper.innerHTML = `
                    <div class="bg-white border border-slate-200 text-slate-500 p-4 rounded-2xl rounded-tl-sm text-sm shadow-sm flex items-center gap-2">
                        <div class="animate-spin h-4 w-4 border-2 border-slate-500 border-t-transparent rounded-full"></div>
                        Thinking...
                    </div>
                `;
                container.appendChild(loadingWrapper);
            }
            
            container.scrollTop = container.scrollHeight;
        };

        const openChat = () => {
            document.getElementById('chat-modal').classList.add('active');
            renderChatMessages();
        };
        
        const closeChat = () => {
            document.getElementById('chat-modal').classList.remove('active');
        };

        const checkChatInputState = () => {
            const val = document.getElementById('chat-input').value.trim();
            document.getElementById('btn-chat-send').disabled = val.length === 0 || isChatLoading;
        };

        document.getElementById('chat-input').addEventListener('input', checkChatInputState);

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputEl = document.getElementById('chat-input');
            const message = inputEl.value.trim();
            if (!message || isChatLoading) return;

            inputEl.value = "";
            checkChatInputState();
            
            chatHistory.push({ role: "user", parts: [{ text: message }] });
            isChatLoading = true;
            renderChatMessages();

            const contextItem = getCurrentContextItem();

            try {
                const payload = {
                    contents: chatHistory,
                    systemInstruction: { parts: [{ text: `You are an encouraging English tutor. The user is currently studying the word "${contextItem.word}" (${contextItem.definition}). Keep answers short (1-3 sentences). Help them understand how to use it in context.` }] },
                };
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                chatHistory.push({ role: "model", parts: [{ text: text || "Try asking differently." }] });
            } catch (error) {
                chatHistory.push({ role: "model", parts: [{ text: "Connection error. Please try again." }] });
            } finally {
                isChatLoading = false;
                renderChatMessages();
                checkChatInputState(); // re-eval disable state
            }
        });

        // --- INIT APP ---
        window.onload = () => {
            lucide.createIcons();
            initSpeechRecognition();
            
            studyList = shuffleArray(vocabList);
            updateStudyUI();
            
            generateNewSentenceQuestion();
            generateNewQuizQuestion();
            
            switchTab('study'); // Ensure correct initial state
        };

    </script>
</body>
</html>
