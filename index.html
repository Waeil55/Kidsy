<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VocabMaster Pro - AI Gamified Tutor</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; overscroll-behavior: none; }
        
        /* Animations */
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .zoom-in { animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .shake { animation: shake 0.4s ease-in-out; }
        
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pop { 0% { transform: scale(0.9); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        /* Layout */
        .app-container { height: 100dvh; display: flex; flex-direction: column; }
        .content-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom UI Elements */
        .letter-box {
            width: 44px; height: 52px; border: 3px solid #e2e8f0; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 800; text-transform: uppercase;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .letter-box.filled { border-color: #818cf8; background-color: #e0e7ff; color: #4f46e5; transform: scale(1.05); }
        .letter-box.correct { border-color: #10b981; background-color: #d1fae5; color: #047857; animation: pop 0.3s ease-out; }
        .letter-box.revealed { border-color: #f59e0b; background-color: #fef3c7; color: #b45309; }
        
        .btn-press { transition: transform 0.1s; }
        .btn-press:active { transform: scale(0.95); }

        .streak-fire {
            background: linear-gradient(to right, #f59e0b, #ef4444);
            -webkit-background-clip: text; color: transparent;
            text-shadow: 0px 2px 10px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased app-container">

    <!-- Start Screen Gateway (Required for AudioContext) -->
    <div id="start-screen" class="fixed inset-0 bg-gradient-to-br from-indigo-600 to-purple-700 z-[100] flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <div class="bg-white/10 backdrop-blur-md p-8 rounded-3xl flex flex-col items-center max-w-sm w-[90%] text-center border border-white/20 shadow-2xl pop">
            <div class="w-20 h-20 bg-yellow-400 rounded-full flex items-center justify-center mb-6 shadow-lg shadow-yellow-400/50">
                <i data-lucide="rocket" class="w-10 h-10 text-orange-600"></i>
            </div>
            <h1 class="text-4xl font-black mb-2 tracking-tight">VocabMaster</h1>
            <p class="text-indigo-100 mb-8 font-medium">Get ready to level up your vocabulary with AI and sound!</p>
            <button onclick="startApp()" class="w-full bg-white text-indigo-700 font-extrabold text-xl py-4 rounded-2xl shadow-[0_8px_0_#cbd5e1] hover:shadow-[0_4px_0_#cbd5e1] hover:translate-y-1 transition-all active:shadow-none active:translate-y-2">
                TAP TO START!
            </button>
        </div>
    </div>

    <!-- App Header -->
    <header class="bg-gradient-to-r from-indigo-700 to-violet-800 text-white pt-6 pb-4 px-4 sm:px-6 shrink-0 shadow-md z-10">
        <div class="flex justify-between items-start mb-4 max-w-4xl mx-auto w-full relative">
            <div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-6 h-6 text-yellow-300"></i> VocabMaster
                </h1>
                <p class="text-indigo-200 text-xs sm:text-sm mt-1 font-semibold">Gamified AI Learning</p>
            </div>
            <div id="streak-container" class="bg-slate-900/40 backdrop-blur-md px-4 py-2 rounded-2xl flex items-center gap-2 border border-white/10 shadow-xl transition-all duration-300">
                <i data-lucide="flame" id="streak-icon" class="w-5 h-5 text-orange-400 drop-shadow-md"></i>
                <div class="flex flex-col -gap-1">
                    <span class="text-[10px] uppercase font-bold text-slate-300 leading-none">Streak</span>
                    <span id="streak-counter" class="font-black text-xl leading-none">0</span>
                </div>
            </div>
        </div>

        <!-- Scrollable Tabs -->
        <nav class="max-w-4xl mx-auto w-full overflow-x-auto no-scrollbar pb-1">
            <div class="flex gap-2">
                <button onclick="switchTab('study')" id="tab-study" class="tab-btn flex-none px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all bg-white text-indigo-700 shadow-sm btn-press">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Study
                </button>
                <button onclick="switchTab('sentences')" id="tab-sentences" class="tab-btn flex-none px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all text-white/80 hover:bg-white/20 btn-press">
                    <i data-lucide="edit-3" class="w-4 h-4"></i> Context
                </button>
                <button onclick="switchTab('quiz')" id="tab-quiz" class="tab-btn flex-none px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all text-white/80 hover:bg-white/20 btn-press">
                    <i data-lucide="target" class="w-4 h-4"></i> Match
                </button>
                <button onclick="switchTab('spell')" id="tab-spell" class="tab-btn flex-none px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all text-white/80 hover:bg-white/20 btn-press">
                    <i data-lucide="keyboard" class="w-4 h-4"></i> Spell
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="content-area p-4 w-full max-w-4xl mx-auto flex flex-col relative bg-slate-50 sm:bg-white sm:mt-4 sm:rounded-3xl sm:shadow-xl sm:border sm:border-slate-200 sm:mb-4">
        
        <!-- STUDY SECTION -->
        <section id="sec-study" class="flex-1 flex flex-col fade-in">
            <div class="flex justify-between items-center mb-6 text-slate-400 font-bold text-xs uppercase tracking-widest bg-slate-100 py-2 px-4 rounded-full self-center">
                <span id="study-progress">Card 1 of 10</span>
                <span class="mx-2 opacity-30">|</span>
                <span class="flex items-center gap-1 text-indigo-500"><i data-lucide="shuffle" class="w-3 h-3"></i> Shuffled</span>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center min-h-[250px] px-2">
                <h2 id="study-word" class="text-5xl sm:text-7xl font-black text-slate-800 mb-8 capitalize tracking-tight text-center drop-shadow-sm pop">word</h2>
                
                <div class="w-full max-w-md bg-white p-6 rounded-3xl border-2 border-indigo-100 flex flex-col items-center justify-center gap-5 relative shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-8">
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/3 h-1.5 bg-indigo-500 rounded-b-full"></div>
                    <p id="study-def" class="text-xl sm:text-2xl text-slate-700 text-center w-full font-medium leading-relaxed"></p>
                    <button onclick="readDefinition()" class="text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 p-2.5 px-5 rounded-full transition-colors flex items-center gap-2 text-sm font-black border-2 border-indigo-100 btn-press">
                        <i data-lucide="volume-2" class="w-5 h-5"></i> Read Out Loud
                    </button>
                </div>
            </div>

            <div class="flex gap-3 w-full mt-auto mb-6 shrink-0 max-w-md mx-auto">
                <button onclick="readWord()" class="flex-1 flex flex-col items-center justify-center py-4 rounded-2xl bg-blue-500 text-white shadow-[0_6px_0_#2563eb] hover:translate-y-1 hover:shadow-[0_2px_0_#2563eb] active:translate-y-2 active:shadow-none transition-all btn-press">
                    <i data-lucide="play-circle" class="mb-1 w-7 h-7"></i>
                    <span class="font-bold">Listen</span>
                </button>
                <button id="btn-practice-mic" onclick="togglePracticeRec()" class="flex-1 flex flex-col items-center justify-center py-4 rounded-2xl bg-emerald-500 text-white shadow-[0_6px_0_#059669] hover:translate-y-1 hover:shadow-[0_2px_0_#059669] active:translate-y-2 active:shadow-none transition-all btn-press">
                    <i data-lucide="mic" class="mb-1 w-7 h-7"></i>
                    <span class="font-bold">Say It</span>
                </button>
            </div>

            <div id="pronounce-feedback" class="hidden w-full max-w-md mx-auto p-4 rounded-2xl flex items-center gap-3 border-2 mb-6 pop shrink-0 shadow-lg"></div>

            <div class="flex justify-between items-center w-full border-t border-slate-200 pt-4 shrink-0 mt-auto">
                <div class="flex gap-2">
                    <button onclick="prevWord()" class="p-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-colors btn-press font-bold"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                    <button onclick="nextWord()" class="p-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-colors btn-press font-bold"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>
                </div>
                <button onclick="openChat()" class="flex items-center gap-2 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-black py-3 px-6 rounded-2xl shadow-lg transition-all btn-press">
                    <i data-lucide="bot" class="w-5 h-5 animate-bounce"></i> Chat with AI
                </button>
            </div>
        </section>

        <!-- SENTENCES SECTION -->
        <section id="sec-sentences" class="hidden flex-1 flex flex-col fade-in">
            <div class="flex-1 flex flex-col justify-center min-h-[250px]">
                <h3 class="text-sm font-black text-slate-400 mb-4 flex items-center justify-center gap-2 uppercase tracking-widest">
                    <i data-lucide="puzzle" class="w-4 h-4 text-amber-500"></i> Fill in the blank
                </h3>
                <div class="bg-white p-6 sm:p-8 rounded-3xl border-2 border-amber-100 shadow-[0_8px_30px_rgb(251,191,36,0.15)] mb-8 pop relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-20 h-20 bg-amber-100 rounded-bl-[100px] -z-10 opacity-50"></div>
                    <p id="sentence-text" class="text-2xl sm:text-3xl text-slate-800 font-bold leading-normal"></p>
                </div>
            </div>

            <div class="w-full flex flex-col gap-3 mb-4 shrink-0 max-w-xl mx-auto">
                <div class="flex gap-2 w-full relative">
                    <div class="relative flex-1 group">
                        <input type="text" id="sentence-input" placeholder="Type the missing word..." class="w-full pl-5 pr-14 py-4 bg-white border-2 border-slate-200 rounded-2xl focus:border-amber-400 focus:ring-4 focus:ring-amber-100 text-lg font-bold outline-none transition-all disabled:bg-slate-100 disabled:text-slate-400 shadow-sm">
                        <button id="btn-sentence-mic" onclick="toggleSentenceRec()" class="absolute right-2 top-1/2 -translate-y-1/2 p-2.5 rounded-xl bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-amber-600 transition-colors btn-press">
                            <i data-lucide="mic" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <button id="btn-sentence-check" onclick="checkSentence()" class="bg-amber-500 text-white font-black py-4 px-8 rounded-2xl shadow-[0_6px_0_#d97706] hover:translate-y-1 hover:shadow-[0_2px_0_#d97706] active:translate-y-2 active:shadow-none transition-all btn-press text-lg">Check</button>
                </div>
                <button id="btn-sentence-next" onclick="loadSentenceQuestion()" class="hidden w-full bg-slate-800 text-white font-black py-4 px-8 rounded-2xl shadow-[0_6px_0_#0f172a] hover:translate-y-1 hover:shadow-[0_2px_0_#0f172a] active:translate-y-2 active:shadow-none transition-all btn-press text-lg flex items-center justify-center gap-2 pop">Next Question <i data-lucide="arrow-right" class="w-5 h-5"></i></button>
            </div>

            <div id="sentence-feedback" class="hidden w-full max-w-xl mx-auto p-4 rounded-2xl flex items-center justify-center gap-3 border-2 mb-6 pop shrink-0 shadow-lg text-lg"></div>

            <div class="flex justify-between items-center w-full border-t border-slate-200 pt-4 mt-auto shrink-0">
                <button id="btn-sentence-hint" onclick="getSmartHint()" class="flex items-center gap-2 px-5 py-3 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-2xl font-black text-sm transition-all btn-press disabled:opacity-50 border-2 border-amber-200">
                    <i data-lucide="lightbulb" class="w-5 h-5"></i> AI Hint
                </button>
                <button onclick="openChat()" class="flex items-center gap-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-black py-3 px-6 rounded-2xl shadow-lg transition-all btn-press">
                    <i data-lucide="bot" class="w-5 h-5"></i> Chat
                </button>
            </div>
            <div id="sentence-hint-box" class="hidden mt-4 p-5 bg-gradient-to-br from-amber-50 to-yellow-50 border-2 border-yellow-200 rounded-2xl text-yellow-900 text-sm sm:text-base pop shrink-0 shadow-md"></div>
        </section>

        <!-- QUIZ SECTION -->
        <section id="sec-quiz" class="hidden flex-1 flex flex-col fade-in">
             <div class="flex-1 flex flex-col justify-center min-h-[200px]">
                <h3 class="text-sm font-black text-slate-400 mb-4 flex items-center justify-center gap-2 uppercase tracking-widest">
                    <i data-lucide="target" class="w-4 h-4 text-emerald-500"></i> Find the word
                </h3>
                <div class="bg-white p-6 sm:p-8 rounded-3xl border-2 border-emerald-100 shadow-[0_8px_30px_rgb(16,185,129,0.1)] flex flex-col items-center justify-center text-center relative mb-8 pop">
                    <p id="quiz-def" class="text-xl sm:text-2xl text-slate-800 font-bold italic z-10 leading-relaxed">"definition"</p>
                    <button onclick="readText(quizQuestion.definition)" class="mt-4 text-emerald-600 bg-emerald-50 p-2.5 rounded-full border border-emerald-200 hover:bg-emerald-100 transition-colors btn-press font-bold flex items-center gap-2 text-sm">
                        <i data-lucide="volume-2" class="w-4 h-4"></i> Read
                    </button>
                </div>
            </div>

            <div id="quiz-options" class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full mb-6 shrink-0 max-w-2xl mx-auto">
                <!-- Options injected -->
            </div>

            <div id="quiz-next-container" class="hidden justify-center w-full pop mb-6 shrink-0 max-w-2xl mx-auto">
                <button onclick="loadQuizQuestion()" class="w-full bg-slate-800 text-white font-black py-4 px-10 rounded-2xl shadow-[0_6px_0_#0f172a] hover:translate-y-1 hover:shadow-[0_2px_0_#0f172a] active:translate-y-2 active:shadow-none transition-all text-lg flex items-center justify-center gap-2">
                    Next Question <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex justify-between items-center w-full border-t border-slate-200 pt-4 mt-auto shrink-0">
                <button id="btn-quiz-hint" onclick="getSmartHint()" class="flex items-center gap-2 px-5 py-3 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded-2xl font-black text-sm transition-all btn-press disabled:opacity-50 border-2 border-emerald-200">
                    <i data-lucide="lightbulb" class="w-5 h-5"></i> AI Hint
                </button>
                <button onclick="openChat()" class="flex items-center gap-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-black py-3 px-6 rounded-2xl shadow-lg transition-all btn-press">
                    <i data-lucide="bot" class="w-5 h-5"></i> Chat
                </button>
            </div>
            <div id="quiz-hint-box" class="hidden mt-4 p-5 bg-gradient-to-br from-emerald-50 to-green-50 border-2 border-emerald-200 rounded-2xl text-emerald-900 text-sm sm:text-base pop shrink-0 shadow-md"></div>
        </section>

        <!-- SPELL SECTION -->
        <section id="sec-spell" class="hidden flex-1 flex flex-col fade-in">
             <div class="flex-1 flex flex-col items-center justify-center min-h-[250px]">
                <div class="flex items-center justify-center gap-3 mb-8 w-full">
                    <button onclick="readText(spellQuestion.word)" class="px-6 py-4 rounded-2xl bg-indigo-500 text-white shadow-[0_6px_0_#4338ca] hover:translate-y-1 hover:shadow-[0_2px_0_#4338ca] active:translate-y-2 active:shadow-none transition-all btn-press flex flex-col items-center gap-1 font-bold">
                         <i data-lucide="volume-2" class="w-8 h-8"></i>
                         <span class="text-xs uppercase tracking-wider">Listen</span>
                    </button>
                    <button onclick="readText(spellQuestion.definition)" class="px-6 py-4 rounded-2xl bg-white border-2 border-slate-200 text-slate-600 hover:bg-slate-50 transition-all btn-press flex flex-col items-center gap-1 font-bold shadow-sm">
                         <i data-lucide="book-open" class="w-8 h-8 text-indigo-400"></i>
                         <span class="text-xs uppercase tracking-wider">Meaning</span>
                    </button>
                </div>

                <!-- Letter Boxes -->
                <div id="spell-boxes" class="flex flex-wrap justify-center gap-2 mb-8 px-2">
                    <!-- Boxes injected via JS -->
                </div>
            </div>

            <!-- Virtual Keyboard -->
            <div id="virtual-keyboard" class="flex flex-wrap justify-center gap-2 mb-6 shrink-0 max-w-lg mx-auto bg-slate-100 p-3 rounded-3xl border-2 border-slate-200 shadow-inner">
                 <!-- Keys injected via JS -->
            </div>

            <div id="spell-feedback" class="hidden w-full max-w-lg mx-auto p-4 rounded-2xl flex justify-between items-center border-2 mb-6 pop shrink-0 shadow-lg">
                <span id="spell-feedback-text" class="font-black text-lg"></span>
                <button onclick="loadSpellQuestion()" class="bg-slate-800 text-white px-5 py-2.5 rounded-xl font-bold shadow-md btn-press">Next</button>
            </div>

            <div class="flex justify-between items-center w-full border-t border-slate-200 pt-4 mt-auto shrink-0">
                <div class="flex gap-2">
                    <button onclick="handleSpellBackspace()" class="p-3.5 bg-slate-200 text-slate-600 rounded-2xl hover:bg-slate-300 font-bold btn-press"><i data-lucide="delete" class="w-5 h-5"></i></button>
                    <button onclick="revealSpellWord()" id="btn-spell-reveal" class="px-5 py-3 bg-white border-2 border-rose-200 text-rose-600 rounded-2xl font-black text-sm hover:bg-rose-50 btn-press">Give Up</button>
                </div>
                <button onclick="openChat()" class="flex items-center gap-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-black py-3 px-6 rounded-2xl shadow-lg transition-all btn-press">
                    <i data-lucide="bot" class="w-5 h-5"></i> Chat
                </button>
            </div>
        </section>

    </main>

    <!-- Chat Modal -->
    <div id="chat-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50 transition-opacity">
        <div class="bg-slate-50 w-full h-[85vh] sm:h-[80vh] sm:max-w-md sm:rounded-[32px] shadow-2xl flex flex-col overflow-hidden slide-up sm:zoom-in rounded-t-3xl border border-slate-200">
            
            <div class="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-5 flex justify-between items-center shrink-0 shadow-md z-10">
                <div>
                    <h3 class="font-black text-xl flex items-center gap-2">
                        <i data-lucide="bot" class="w-6 h-6"></i> AI Super Tutor
                    </h3>
                    <p id="chat-context-subtitle" class="text-purple-100 text-xs font-bold uppercase tracking-wider mt-1"></p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-chat-speak-toggle" onclick="toggleAutoSpeakChat()" class="p-2.5 text-purple-600 bg-white rounded-full transition-transform hover:scale-105 active:scale-95 shadow-sm" title="Toggle Auto-Speak">
                        <i data-lucide="volume-2" class="w-5 h-5"></i>
                    </button>
                    <button onclick="closeChat()" class="p-2.5 hover:bg-white/20 rounded-full transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
            </div>

            <div id="chat-history" class="flex-1 overflow-y-auto p-5 flex flex-col gap-4 bg-slate-100">
                <!-- Chat messages -->
            </div>

            <div class="p-4 bg-white border-t border-slate-200 flex gap-2 items-center shrink-0 pb-safe">
                <button id="btn-chat-mic" onclick="toggleChatRec()" class="p-3.5 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-purple-600 transition-colors btn-press shadow-inner">
                    <i data-lucide="mic" class="w-6 h-6"></i>
                </button>
                <input type="text" id="chat-input" placeholder="Ask your tutor anything..." class="flex-1 bg-slate-50 border-2 border-slate-200 focus:bg-white focus:border-purple-400 focus:ring-4 focus:ring-purple-100 rounded-full px-5 py-3.5 text-base font-bold outline-none transition-all shadow-inner">
                <button onclick="sendChatMessage()" id="btn-chat-send" class="bg-purple-600 hover:bg-purple-700 text-white p-3.5 rounded-full shadow-lg transition-all btn-press disabled:bg-slate-300 disabled:shadow-none">
                    <i data-lucide="send" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA (From Image 1 & 2) ---
        const vocabData = [
            { word: "privilege", definition: "a special benefit enjoyed only under certain circumstances", sentences: ["Driving a car is a _________, not a right.", "Having access to clean water is a _________.", "It was a huge _________ to meet the famous author.", "She had the _________ of choosing the colors."] },
            { word: "elegant", definition: "something that is high quality and fancy", sentences: ["She wore an _________ gown to the ball.", "The hotel lobby was very _________.", "He wrote an _________ math proof.", "The swan looked incredibly _________ on the lake."] },
            { word: "calculate", definition: "to determine the answer", sentences: ["We need to _________ the area.", "Please _________ the total cost.", "The computer can _________ complex equations.", "It's hard to _________ how much paint we need."] },
            { word: "grumble", definition: "to complain about something in a quiet voice", sentences: ["My stomach started to _________ loudly.", "He would always _________ about the weather.", "\"I hate waking up early,\" she began to _________.", "We heard the thunder _________."] },
            { word: "assemble", definition: "to put together", sentences: ["It took hours to _________ the furniture.", "The students will _________ in the auditorium.", "We must _________ a team of experts.", "They _________ thousands of cars daily."] },
            { word: "fragile", definition: "easily broken or damaged", sentences: ["Be careful with that glass, it is _________.", "The butterfly's wings look _________.", "The old documents are too _________ to touch.", "He felt emotionally _________ after the news."] },
            { word: "research", definition: "to study a specific subject", sentences: ["He needs to do more _________.", "Scientists are conducting new _________.", "I spent the afternoon doing _________ at the library.", "Medical _________ has advanced significantly."] },
            { word: "defend", definition: "to prove by giving evidence", sentences: ["The lawyer will _________ her client.", "The army must _________ the borders.", "You must _________ your argument with facts.", "He had to _________ his thesis to the teachers."] },
            { word: "specific", definition: "to be particular or precise", sentences: ["Can you be more _________ about the time?", "This recipe needs a _________ type of flour.", "I need a _________ tool to fix this.", "She gave _________ details to the police."] },
            { word: "pledge", definition: "a promise or agreement to do or not to do something", sentences: ["We say the _________ of allegiance.", "The knights made a _________ of loyalty.", "Please _________ a small donation.", "I made a _________ to exercise every day."] }
        ];

        // --- STATE ---
        let studyList = [];
        let currentIndex = 0;
        let activeTab = 'study';
        let streak = 0;
        let isAppStarted = false;
        
        let sentenceQuestion = null;
        let sentenceResult = null;
        let quizQuestion = null;
        let quizResult = null;
        let spellQuestion = null;
        let spellInput = [];
        let spellResult = null;
        
        let chatHistory = [];
        let isChatLoading = false;
        let isAutoSpeakingChat = true;

        let practiceRec, sentenceRec, chatRec;
        let isPracticeRecording = false, isSentenceRecording = false, isChatRecording = false;

        // Audio Synths
        let toneCorrect, toneIncorrect, tonePop;
        const praises = ["Awesome!", "Great job!", "You got it!", "Fantastic!", "Brilliant!", "Spot on!", "Superstar!", "You're a genius!"];

        const GEMINI_API_KEY = ""; // Required for AI Chat & Hints

        // --- INITIALIZATION ---
        async function startApp() {
            if(isAppStarted) return;
            
            // Init Tone.js Audio Context on user click
            await Tone.start();
            setupAudio();
            
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('start-screen').classList.add('hidden'); }, 500);

            lucide.createIcons();
            shuffleStudyList();
            setupSpeechRecognition();
            loadSentenceQuestion();
            loadQuizQuestion();

            document.getElementById('sentence-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkSentence(); });
            document.getElementById('chat-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChatMessage(); });
            
            isAppStarted = true;
            playPop(); // confirmation sound
        }

        // --- AUDIO & GAMIFICATION SYSTEM ---
        function setupAudio() {
            toneCorrect = new Tone.PolySynth(Tone.Synth).toDestination();
            toneCorrect.volume.value = -12;
            
            toneIncorrect = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.05, decay: 0.2, sustain: 0, release: 0.2 } }).toDestination();
            toneIncorrect.volume.value = -10;
            
            tonePop = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
            tonePop.volume.value = -15;

            // Add click listeners to all buttons for pop sound
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => { if(isAppStarted) playPop(); });
            });
        }

        function playCorrect() { if(Tone.context.state === 'running') { const now = Tone.now(); toneCorrect.triggerAttackRelease("C5", "8n", now); toneCorrect.triggerAttackRelease("E5", "8n", now + 0.1); toneCorrect.triggerAttackRelease("G5", "8n", now + 0.2); toneCorrect.triggerAttackRelease("C6", "4n", now + 0.3); } }
        function playIncorrect() { if(Tone.context.state === 'running') toneIncorrect.triggerAttackRelease("G3", "8n"); }
        function playPop() { if(Tone.context.state === 'running') tonePop.triggerAttackRelease("C6", "32n"); }

        function triggerConfetti(big = false) {
            if(big) {
                var duration = 3 * 1000; var end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#4f46e5', '#10b981', '#f59e0b'] });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ec4899', '#3b82f6', '#8b5cf6'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } else {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4f46e5', '#10b981', '#f59e0b', '#ec4899'] });
            }
        }

        function playPraise() {
            const praise = praises[Math.floor(Math.random() * praises.length)];
            readText(praise, 1.2, 1.3); // Faster, higher pitch for excitement
        }

        function updateStreak(won) {
            const container = document.getElementById('streak-container');
            const icon = document.getElementById('streak-icon');
            
            if(won) {
                streak++;
                playCorrect();
                
                // Milestone logic
                if(streak > 0 && streak % 5 === 0) {
                    triggerConfetti(true);
                    setTimeout(() => readText(`Holy cow! A streak of ${streak}! You are on fire!`, 1.1, 1.2), 1000);
                    container.classList.add('scale-110', 'bg-gradient-to-r', 'from-amber-400', 'to-orange-500', 'border-amber-300');
                    icon.classList.replace('text-orange-400', 'text-white');
                    document.getElementById('streak-counter').classList.add('text-white');
                } else {
                    triggerConfetti(false);
                    setTimeout(() => playPraise(), 500);
                    container.classList.add('scale-110', 'bg-emerald-500/20', 'border-emerald-500');
                }
                setTimeout(() => { container.classList.remove('scale-110', 'bg-emerald-500/20', 'border-emerald-500', 'bg-gradient-to-r', 'from-amber-400', 'to-orange-500', 'border-amber-300'); icon.classList.replace('text-white', 'text-orange-400'); document.getElementById('streak-counter').classList.remove('text-white');}, 1000);
            } else {
                streak = 0;
                playIncorrect();
                container.classList.add('shake', 'bg-rose-500/20', 'border-rose-500');
                setTimeout(() => container.classList.remove('shake', 'bg-rose-500/20', 'border-rose-500'), 500);
            }
            document.getElementById('streak-counter').innerText = streak;
        }

        // --- UTILS ---
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function readText(text, rate = 0.9, pitch = 1) {
            window.speechSynthesis.cancel(); // Stop current speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = rate;
            utterance.pitch = pitch;
            window.speechSynthesis.speak(utterance);
        }

        function shuffleStudyList() { studyList = shuffleArray(vocabData); currentIndex = 0; }
        function currentWord() { return studyList[currentIndex]; }
        function getCurrentContextItem() {
            if (activeTab === 'sentences' && sentenceQuestion) return sentenceQuestion;
            if (activeTab === 'quiz' && quizQuestion) return quizQuestion;
            if (activeTab === 'spell' && spellQuestion) return spellQuestion;
            return currentWord();
        }

        // --- STREAMING_CHUNK:Setting up Web Speech API... ---
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            practiceRec = new SpeechRecognition(); practiceRec.continuous = false; practiceRec.interimResults = false;
            practiceRec.onstart = () => { isPracticeRecording = true; document.getElementById('btn-practice-mic').classList.replace('bg-emerald-500', 'bg-rose-500'); document.getElementById('btn-practice-mic').classList.add('animate-pulse'); };
            practiceRec.onresult = (e) => { checkPronunciation(e.results[0][0].transcript); };
            practiceRec.onend = practiceRec.onerror = () => { isPracticeRecording = false; document.getElementById('btn-practice-mic').classList.replace('bg-rose-500', 'bg-emerald-500'); document.getElementById('btn-practice-mic').classList.remove('animate-pulse'); };

            sentenceRec = new SpeechRecognition(); sentenceRec.continuous = false; sentenceRec.interimResults = true;
            sentenceRec.onstart = () => { isSentenceRecording = true; document.getElementById('btn-sentence-mic').classList.add('text-rose-600', 'bg-rose-100'); };
            sentenceRec.onresult = (e) => { document.getElementById('sentence-input').value = Array.from(e.results).map(r => r[0].transcript).join(''); };
            sentenceRec.onend = sentenceRec.onerror = () => { isSentenceRecording = false; document.getElementById('btn-sentence-mic').classList.remove('text-rose-600', 'bg-rose-100'); };

            chatRec = new SpeechRecognition(); chatRec.continuous = false; chatRec.interimResults = true;
            chatRec.onstart = () => { isChatRecording = true; document.getElementById('btn-chat-mic').classList.add('text-rose-600', 'bg-rose-100'); };
            chatRec.onresult = (e) => { document.getElementById('chat-input').value = Array.from(e.results).map(r => r[0].transcript).join(''); };
            chatRec.onend = chatRec.onerror = () => { isChatRecording = false; document.getElementById('btn-chat-mic').classList.remove('text-rose-600', 'bg-rose-100'); };
        }

        function togglePracticeRec() { if(practiceRec) isPracticeRecording ? practiceRec.stop() : practiceRec.start(); }
        function toggleSentenceRec() { if(sentenceRec) isSentenceRecording ? sentenceRec.stop() : sentenceRec.start(); }
        function toggleChatRec() { if(chatRec) isChatRecording ? chatRec.stop() : chatRec.start(); }

        // --- STREAMING_CHUNK:Implementing Study UI Updates... ---
        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`sec-${tabId}`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-white', 'text-indigo-700', 'shadow-sm');
                b.classList.add('text-white/80');
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            activeBtn.classList.remove('text-white/80');
            activeBtn.classList.add('bg-white', 'text-indigo-700', 'shadow-sm');
            
            window.speechSynthesis.cancel();
            updateUI();
        }

        function updateUI() {
            if(activeTab === 'study') {
                document.getElementById('study-word').innerText = currentWord().word;
                
                // Re-trigger pop animation on word change
                document.getElementById('study-word').classList.remove('pop');
                void document.getElementById('study-word').offsetWidth;
                document.getElementById('study-word').classList.add('pop');
                
                document.getElementById('study-def').innerText = currentWord().definition;

                document.getElementById('pronounce-feedback').classList.add('hidden');
            }
        }

        function nextWord() { currentIndex = (currentIndex + 1) % studyList.length; updateUI(); }
        function prevWord() { currentIndex = (currentIndex - 1 + studyList.length) % studyList.length; updateUI(); }
        function readWord() { readText(currentWord().word); }
        function readDefinition() { readText(currentWord().definition); }

        function checkPronunciation(transcript) {
            const cleanT = transcript.toLowerCase().replace(/[^a-z]/g, "");
            const cleanW = currentWord().word.toLowerCase().replace(/[^a-z]/g, "");
            const isCorrect = cleanT.includes(cleanW) || cleanT === cleanW;
            
            const fb = document.getElementById('pronounce-feedback');
            fb.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200');
            fb.classList.add(isCorrect ? 'bg-emerald-50' : 'bg-rose-50', isCorrect ? 'text-emerald-800' : 'text-rose-800', isCorrect ? 'border-emerald-200' : 'border-rose-200');
            
            fb.innerHTML = `
                <i data-lucide="${isCorrect ? 'check-circle' : 'x-circle'}" class="w-8 h-8 shrink-0 ${isCorrect ? 'text-emerald-500' : 'text-rose-500'}"></i>
                <div><p class="font-black text-lg">${isCorrect ? 'Perfect pronunciation!' : 'Not quite right.'}</p><p class="text-sm opacity-80 font-medium">Heard: "${transcript}"</p></div>
            `;
            lucide.createIcons();
            
            // Integrate Gamification
            if(isCorrect) {
                playCorrect();
                triggerConfetti();
                setTimeout(() => playPraise(), 500);
            } else {
                playIncorrect();
            }
        }

        // --- STREAMING_CHUNK:Implementing Endless Sentences... ---
        function loadSentenceQuestion() {
            const w = vocabData[Math.floor(Math.random() * vocabData.length)];
            sentenceQuestion = { ...w, sentence: w.sentences[Math.floor(Math.random() * w.sentences.length)] };
            sentenceResult = null;
            
            const input = document.getElementById('sentence-input');
            input.value = ""; input.disabled = false;
            document.getElementById('btn-sentence-mic').disabled = false;
            
            document.getElementById('btn-sentence-check').classList.remove('hidden');
            document.getElementById('btn-sentence-next').classList.add('hidden');
            document.getElementById('sentence-feedback').classList.add('hidden');
            document.getElementById('sentence-hint-box').classList.add('hidden');
            
            renderSentenceHtml();
        }

        function renderSentenceHtml() {
            const parts = sentenceQuestion.sentence.split('_________');
            const blankHTML = sentenceResult === 'correct' 
                ? `<span class="inline-block border-b-4 border-emerald-500 text-emerald-600 font-black px-3 mx-1 pop">${sentenceQuestion.word}</span>`
                : `<span class="inline-block border-b-4 border-slate-300 w-20 sm:w-28 mx-1"></span>`;
            document.getElementById('sentence-text').innerHTML = parts.join(blankHTML);
        }

        function checkSentence() {
            const val = document.getElementById('sentence-input').value.trim().toLowerCase();
            if(!val) return;
            
            const isCorrect = val === sentenceQuestion.word.toLowerCase();
            sentenceResult = isCorrect ? 'correct' : 'incorrect';
            updateStreak(isCorrect);
            
            document.getElementById('sentence-input').disabled = true;
            document.getElementById('btn-sentence-mic').disabled = true;
            document.getElementById('btn-sentence-check').classList.add('hidden');
            document.getElementById('btn-sentence-next').classList.remove('hidden');
            
            const fb = document.getElementById('sentence-feedback');
            fb.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200', 'bg-rose-50', 'text-rose-700', 'border-rose-200');
            fb.classList.add(isCorrect ? 'bg-emerald-50' : 'bg-rose-50', isCorrect ? 'text-emerald-700' : 'text-rose-700', isCorrect ? 'border-emerald-200' : 'border-rose-200');
            fb.innerHTML = `
                <i data-lucide="${isCorrect ? 'check-circle' : 'x-circle'}" class="w-7 h-7 shrink-0 ${isCorrect ? 'text-emerald-500' : 'text-rose-500'}"></i>
                <span>${isCorrect ? 'Awesome job!' : `Oops! The word is "${sentenceQuestion.word}".`}</span>
            `;
            lucide.createIcons();
            renderSentenceHtml();
        }

        // --- STREAMING_CHUNK:Implementing Endless Quiz... ---
        function loadQuizQuestion() {
            const target = vocabData[Math.floor(Math.random() * vocabData.length)];
            let options = [target.word];
            while(options.length < 4) {
                const r = vocabData[Math.floor(Math.random() * vocabData.length)].word;
                if(!options.includes(r)) options.push(r);
            }
            quizQuestion = { word: target.word, definition: target.definition, options: shuffleArray(options) };
            quizResult = null;
            
            document.getElementById('quiz-def').innerText = `"${quizQuestion.definition}"`;
            document.getElementById('quiz-next-container').classList.add('hidden');
            document.getElementById('quiz-hint-box').classList.add('hidden');
            renderQuizOptions();
        }

        function renderQuizOptions() {
            const container = document.getElementById('quiz-options');
            container.innerHTML = '';
            quizQuestion.options.forEach(opt => {
                let style = "bg-white border-slate-200 text-slate-700 hover:border-emerald-400 hover:bg-emerald-50 cursor-pointer shadow-sm";
                if (quizResult !== null) {
                    if (opt === quizQuestion.word) style = "bg-emerald-500 border-emerald-600 text-white shadow-md scale-[1.03] pop cursor-default";
                    else if (opt === quizResult) style = "bg-rose-500 border-rose-600 text-white shadow-inner cursor-default shake";
                    else style = "bg-slate-100 border-slate-200 text-slate-400 opacity-50 cursor-default";
                }
                container.innerHTML += `<button onclick="checkQuiz('${opt}')" ${quizResult !== null ? 'disabled' : ''} class="p-5 rounded-2xl border-2 text-xl font-black capitalize transition-all flex items-center justify-center btn-press ${style}">${opt}</button>`;
            });
        }

        function checkQuiz(selected) {
            if(quizResult !== null) return;
            quizResult = selected;
            const isCorrect = selected === quizQuestion.word;
            updateStreak(isCorrect);
            renderQuizOptions();
            document.getElementById('quiz-next-container').classList.remove('hidden');
        }

        // --- STREAMING_CHUNK:Implementing Interactive Spelling... ---
        function loadSpellQuestion() {
            spellQuestion = vocabData[Math.floor(Math.random() * vocabData.length)];
            spellInput = []; spellResult = null;
            document.getElementById('spell-feedback').classList.add('hidden');
            document.getElementById('btn-spell-reveal').disabled = false;
            renderSpellBoxes(); renderKeyboard();
            readText(spellQuestion.word);
        }

        function renderSpellBoxes() {
            const container = document.getElementById('spell-boxes');
            container.innerHTML = '';
            const targetWord = spellQuestion.word;
            
            for(let i=0; i<targetWord.length; i++) {
                let char = spellInput[i] || ''; let statusClass = '';
                if (spellResult === 'correct') statusClass = 'correct';
                else if (spellResult === 'revealed') { char = targetWord[i]; statusClass = 'revealed'; }
                else if (char) statusClass = 'filled';
                container.innerHTML += `<div class="letter-box ${statusClass}">${char}</div>`;
            }
        }

        function renderKeyboard() {
            const container = document.getElementById('virtual-keyboard');
            container.innerHTML = '';
            const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
            
            rows.forEach(row => {
                let html = `<div class="flex justify-center gap-1.5 sm:gap-2 w-full">`;
                row.split('').forEach(key => {
                    html += `<button onclick="handleSpellKey('${key}')" ${spellResult ? 'disabled' : ''} class="w-9 h-12 sm:w-11 sm:h-14 bg-white border-2 border-slate-200 rounded-xl text-slate-800 font-black text-lg hover:bg-slate-50 hover:border-indigo-300 hover:text-indigo-600 active:scale-95 transition-all shadow-sm ${spellResult ? 'opacity-50' : 'btn-press'}">${key}</button>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        function handleSpellKey(char) {
            if (spellResult || spellInput.length >= spellQuestion.word.length) return;
            spellInput.push(char.toLowerCase());
            renderSpellBoxes();
            if (spellInput.length === spellQuestion.word.length) checkSpellWord();
        }

        function handleSpellBackspace() {
            if (spellResult || spellInput.length === 0) return;
            spellInput.pop(); renderSpellBoxes();
        }

        function checkSpellWord() {
            const entered = spellInput.join('');
            if (entered === spellQuestion.word.toLowerCase()) {
                spellResult = 'correct'; updateStreak(true);
                showSpellFeedback('correct', 'Genius speller!');
            } else {
                updateStreak(false);
                showSpellFeedback('incorrect', 'Not quite! Try again.');
                setTimeout(() => {
                    if(spellResult !== 'revealed') { spellInput = []; spellResult = null; renderSpellBoxes(); document.getElementById('spell-feedback').classList.add('hidden'); }
                }, 1500);
            }
            renderSpellBoxes(); renderKeyboard();
        }

        function revealSpellWord() {
            spellResult = 'revealed'; updateStreak(false);
            showSpellFeedback('revealed', `Word: ${spellQuestion.word}`);
            document.getElementById('btn-spell-reveal').disabled = true;
            renderSpellBoxes(); renderKeyboard();
        }

        function showSpellFeedback(status, msg) {
            const fb = document.getElementById('spell-feedback');
            fb.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-amber-50', 'text-amber-800', 'border-amber-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200');
            
            let icon = '';
            if(status === 'correct') { fb.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200'); icon = '<i data-lucide="star" class="w-6 h-6 text-emerald-500 fill-emerald-500 pop"></i>'; }
            else if(status === 'revealed') { fb.classList.add('bg-amber-50', 'text-amber-800', 'border-amber-200'); icon = '<i data-lucide="info" class="w-6 h-6 text-amber-500"></i>'; }
            else { fb.classList.add('bg-rose-50', 'text-rose-800', 'border-rose-200'); icon = '<i data-lucide="x-circle" class="w-6 h-6 text-rose-500"></i>'; }

            document.getElementById('spell-feedback-text').innerHTML = `<span class="flex items-center gap-2">${icon} ${msg}</span>`;
            lucide.createIcons();
        }

        // --- STREAMING_CHUNK:Implementing Smart AI Chat & Hints... ---
        async function getSmartHint() {
            const contextItem = getCurrentContextItem();
            const btnId = activeTab === 'sentences' ? 'btn-sentence-hint' : 'btn-quiz-hint';
            const boxId = activeTab === 'sentences' ? 'sentence-hint-box' : 'quiz-hint-box';
            
            const btn = document.getElementById(btnId); const box = document.getElementById(boxId);
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Thinking...`; lucide.createIcons();

            let prompt = activeTab === 'sentences' 
                ? `Student needs help filling blank in: "${contextItem.sentence}". Target word: "${contextItem.word}". Provide ONE extremely clever, fun, 1-sentence hint WITHOUT using any form of the target word. Talk directly to the student.`
                : `Student is matching a word to definition: "${contextItem.definition}". Target word: "${contextItem.word}". Provide a fun 1-sentence mnemonic or scenario that hints at the word without saying it. Talk directly to the student.`;

            try {
                if(!GEMINI_API_KEY) throw new Error("No API Key");
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt}]}] })
                });
                const data = await res.json();
                const hint = data.candidates?.[0]?.content?.parts?.[0]?.text || "Think about synonyms.";
                box.innerHTML = `<div class="flex gap-3"><i data-lucide="sparkles" class="w-6 h-6 text-yellow-500 shrink-0"></i><div><strong class="block mb-1 text-yellow-800">AI Hint:</strong>${hint}</div></div>`;
                box.classList.remove('hidden'); lucide.createIcons();
                playPop();
            } catch (e) {
                box.innerHTML = `<strong>Note:</strong> Set GEMINI_API_KEY in code to enable AI features.`;
                box.classList.remove('hidden');
            } finally {
                btn.innerHTML = `<i data-lucide="lightbulb" class="w-5 h-5 text-amber-500"></i> Hint Shown`; lucide.createIcons();
            }
        }

        function openChat() {
            document.getElementById('chat-modal').classList.remove('hidden');
            document.getElementById('chat-context-subtitle').innerText = `Focus: ${getCurrentContextItem().word}`;
            if (chatHistory.length === 0 || chatHistory[chatHistory.length-1].contextWord !== getCurrentContextItem().word) resetChatContext();
        }
        function closeChat() { document.getElementById('chat-modal').classList.add('hidden'); window.speechSynthesis.cancel(); }

        function toggleAutoSpeakChat() {
            isAutoSpeakingChat = !isAutoSpeakingChat;
            const btn = document.getElementById('btn-chat-speak-toggle');
            if(isAutoSpeakingChat) btn.classList.replace('text-slate-400', 'text-purple-600'), btn.classList.replace('bg-slate-200', 'bg-white');
            else btn.classList.replace('text-purple-600', 'text-slate-400'), btn.classList.replace('bg-white', 'bg-slate-200'), window.speechSynthesis.cancel();
        }

        function resetChatContext() {
            const item = getCurrentContextItem();
            let initMsg = `Hi superstar! Let's talk about **${item.word}**. Do you want to hear a funny example sentence?`;
            
            if (activeTab === 'sentences') initMsg = `Stuck on the sentence for **${item.word}**? I can explain what kind of word belongs there!`;
            else if (activeTab === 'quiz') initMsg = `Trying to find the word that means "${item.definition}"? Tell me what you're guessing!`;
            else if (activeTab === 'spell') initMsg = `Need a trick to remember how to spell **${item.word}**? It can be tricky!`;

            chatHistory = [{ role: "model", parts: [{ text: initMsg }], contextWord: item.word }];
            renderChatHistory();
            if(isAutoSpeakingChat) readText(initMsg.replace(/\*/g, ''));
        }

        function renderChatHistory() {
            const container = document.getElementById('chat-history'); container.innerHTML = '';
            chatHistory.forEach(msg => {
                const isUser = msg.role === 'user';
                const text = msg.parts[0].text.replace(/\*\*(.*?)\*\*/g, '<strong class="font-black">$1</strong>');
                const div = document.createElement('div');
                div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} slide-up`;
                div.innerHTML = `<div class="max-w-[85%] p-4 rounded-3xl text-[15px] shadow-sm leading-relaxed ${isUser ? 'bg-purple-600 text-white rounded-tr-sm font-medium' : 'bg-white border-2 border-slate-200 text-slate-800 rounded-tl-sm'}">${text}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input'); const val = input.value.trim();
            if(!val || isChatLoading) return;

            input.value = ''; chatHistory.push({ role: "user", parts: [{ text: val }], contextWord: getCurrentContextItem().word });
            renderChatHistory();
            
            isChatLoading = true;
            document.getElementById('btn-chat-send').disabled = true;
            document.getElementById('btn-chat-send').innerHTML = `<i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>`; lucide.createIcons();

            try {
                if(!GEMINI_API_KEY) throw new Error("No API Key");
                const sysPrompt = `You are a super fun, high-energy, encouraging English tutor for kids/teens. The student is practicing the word "${getCurrentContextItem().word}" (${getCurrentContextItem().definition}). Actively guide them based on the tab they are on (${activeTab}). Keep responses to 1-2 short, punchy sentences. Praise them. Use bolding for emphasis.`;
                const payloadContent = chatHistory.map(m => ({role: m.role, parts: m.parts}));

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: payloadContent, systemInstruction: {parts:[{text: sysPrompt}]} })
                });
                const data = await res.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "I'm here to help you learn!";
                
                chatHistory.push({ role: "model", parts: [{ text: reply }], contextWord: getCurrentContextItem().word });
                renderChatHistory();
                if(isAutoSpeakingChat) readText(reply.replace(/\*/g, ''));
            } catch (e) {
                chatHistory.push({ role: "model", parts: [{ text: "Oops! You need to set your GEMINI_API_KEY in the code to talk to me!" }], contextWord: getCurrentContextItem().word });
                renderChatHistory();
            } finally {
                isChatLoading = false;
                document.getElementById('btn-chat-send').disabled = false;
                document.getElementById('btn-chat-send').innerHTML = `<i data-lucide="send" class="w-6 h-6"></i>`; lucide.createIcons();
            }
        }
    </script>
</body>
</html>
