<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VocabMaster Pro - AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; overscroll-behavior: none; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .zoom-in { animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        /* PWA specific layout tweaks */
        .app-container { height: 100dvh; display: flex; flex-direction: column; }
        .content-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        
        /* Hide scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .letter-box {
            width: 40px; height: 48px; border: 2px solid #e2e8f0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; text-transform: uppercase;
            transition: all 0.2s;
        }
        .letter-box.filled { border-color: #6366f1; background-color: #e0e7ff; color: #4338ca; }
        .letter-box.correct { border-color: #10b981; background-color: #d1fae5; color: #047857; }
        .letter-box.revealed { border-color: #f59e0b; background-color: #fef3c7; color: #b45309; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased app-container">

    <!-- App Header -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white pt-6 pb-4 px-4 sm:px-6 shrink-0 shadow-md z-10">
        <div class="flex justify-between items-start mb-4 max-w-4xl mx-auto w-full">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-6 h-6 text-yellow-300"></i> VocabMaster
                </h1>
                <p class="text-blue-200 text-xs sm:text-sm mt-1">Intelligent Practice Mode</p>
            </div>
            <div class="bg-white/20 backdrop-blur-sm px-3 py-1.5 rounded-full flex items-center gap-2 border border-white/10 shadow-sm">
                <i data-lucide="flame" class="w-4 h-4 text-orange-400"></i>
                <span id="streak-counter" class="font-bold text-sm">0</span>
            </div>
        </div>

        <!-- Scrollable Tabs -->
        <nav class="max-w-4xl mx-auto w-full overflow-x-auto no-scrollbar pb-1">
            <div class="flex gap-2">
                <button onclick="switchTab('study')" id="tab-study" class="tab-btn flex-none px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition-colors bg-white text-indigo-700 shadow-sm">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Study
                </button>
                <button onclick="switchTab('sentences')" id="tab-sentences" class="tab-btn flex-none px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition-colors text-white/80 hover:bg-white/10">
                    <i data-lucide="edit-3" class="w-4 h-4"></i> Context
                </button>
                <button onclick="switchTab('quiz')" id="tab-quiz" class="tab-btn flex-none px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition-colors text-white/80 hover:bg-white/10">
                    <i data-lucide="target" class="w-4 h-4"></i> Match
                </button>
                <button onclick="switchTab('spell')" id="tab-spell" class="tab-btn flex-none px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition-colors text-white/80 hover:bg-white/10">
                    <i data-lucide="keyboard" class="w-4 h-4"></i> Spell
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="content-area p-4 sm:p-6 w-full max-w-4xl mx-auto flex flex-col relative bg-white sm:mt-4 sm:rounded-2xl sm:shadow-lg sm:border sm:border-slate-200 sm:mb-4">
        
        <!-- STUDY SECTION -->
        <section id="sec-study" class="flex-1 flex flex-col fade-in">
            <div class="flex justify-between items-center mb-6 text-slate-400 font-semibold text-xs uppercase tracking-wider">
                <span id="study-progress">Card 1 of 10</span>
                <span class="flex items-center gap-1"><i data-lucide="shuffle" class="w-3 h-3"></i> Shuffled</span>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center min-h-[300px]">
                <h2 id="study-word" class="text-5xl sm:text-6xl font-black text-slate-800 mb-8 capitalize tracking-tight text-center">word</h2>
                
                <div class="w-full bg-indigo-50/50 p-6 rounded-2xl border border-indigo-100 flex flex-col items-center justify-center gap-4 relative overflow-hidden mb-8">
                    <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                    <p id="study-def" class="text-lg sm:text-xl text-slate-700 text-center w-full font-medium leading-relaxed"></p>
                    <button onclick="speakText(currentWord().definition)" class="text-indigo-600 hover:text-indigo-800 p-2 px-4 rounded-full transition-colors flex items-center gap-2 text-sm font-bold bg-white shadow-sm hover:shadow">
                        <i data-lucide="volume-2" class="w-4 h-4"></i> Read Definition
                    </button>
                </div>
            </div>

            <div class="flex gap-4 w-full mt-auto mb-6 shrink-0">
                <button onclick="speakText(currentWord().word)" class="flex-1 flex flex-col items-center justify-center py-4 rounded-2xl border-2 bg-white border-blue-200 text-blue-600 hover:bg-blue-50 active:scale-95 transition-all shadow-sm">
                    <i data-lucide="volume-2" class="mb-2 w-6 h-6"></i>
                    <span class="font-bold text-sm">Listen</span>
                </button>
                <button id="btn-practice-mic" onclick="togglePracticeRec()" class="flex-1 flex flex-col items-center justify-center py-4 rounded-2xl border-2 bg-white border-emerald-200 text-emerald-600 hover:bg-emerald-50 active:scale-95 transition-all shadow-sm">
                    <i data-lucide="mic" class="mb-2 w-6 h-6"></i>
                    <span class="font-bold text-sm">Pronounce</span>
                </button>
            </div>

            <div id="pronounce-feedback" class="hidden w-full p-4 rounded-xl flex items-center gap-3 border mb-6 slide-up font-medium text-sm sm:text-base shrink-0"></div>

            <div class="flex justify-between items-center w-full border-t border-slate-100 pt-4 shrink-0">
                <div class="flex gap-2">
                    <button onclick="prevWord()" class="p-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-colors"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                    <button onclick="nextWord()" class="p-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-colors"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                </div>
                <button onclick="openChat()" class="flex items-center gap-2 bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-md transition-all text-sm active:scale-95">
                    <i data-lucide="bot" class="w-5 h-5"></i> Ask AI
                </button>
            </div>
        </section>

        <!-- SENTENCES SECTION -->
        <section id="sec-sentences" class="hidden flex-1 flex flex-col fade-in">
            <div class="flex-1 flex flex-col justify-center min-h-[300px]">
                <h3 class="text-sm font-bold text-slate-400 mb-4 flex items-center gap-2 uppercase tracking-wider">
                    <i data-lucide="edit-3" class="w-4 h-4"></i> Fill in the blank
                </h3>
                <div class="bg-amber-50 p-6 sm:p-8 rounded-2xl border border-amber-100 shadow-inner mb-8">
                    <p id="sentence-text" class="text-xl sm:text-2xl text-slate-800 font-medium leading-relaxed"></p>
                </div>
            </div>

            <div class="w-full flex flex-col sm:flex-row gap-3 mb-4 shrink-0">
                <div class="relative flex-1">
                    <input type="text" id="sentence-input" placeholder="Type or speak the missing word..." class="w-full pl-4 pr-12 py-3.5 bg-white border-2 border-slate-200 rounded-xl focus:border-amber-400 focus:ring-0 text-base font-medium outline-none transition-colors disabled:bg-slate-50 disabled:text-slate-500">
                    <button id="btn-sentence-mic" onclick="toggleSentenceRec()" class="absolute right-2 top-1/2 -translate-y-1/2 p-2.5 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 transition-colors">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                    </button>
                </div>
                <button id="btn-sentence-check" onclick="checkSentence()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 px-8 rounded-xl transition-colors shadow-sm active:scale-95">Check</button>
                <button id="btn-sentence-next" onclick="loadSentenceQuestion()" class="hidden bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-8 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2 active:scale-95">Next <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
            </div>

            <div id="sentence-feedback" class="hidden w-full p-4 rounded-xl flex items-center gap-3 border mb-6 slide-up font-bold shrink-0"></div>

            <div class="flex justify-between items-center w-full border-t border-slate-100 pt-4 mt-auto shrink-0">
                <button id="btn-sentence-hint" onclick="getSmartHint()" class="flex items-center gap-2 px-4 py-2.5 bg-yellow-100 text-yellow-800 rounded-xl font-bold text-sm transition-colors active:scale-95 disabled:opacity-50">
                    <i data-lucide="lightbulb" class="w-4 h-4"></i> Get Hint
                </button>
                <button onclick="openChat()" class="flex items-center gap-2 bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-md transition-all text-sm active:scale-95">
                    <i data-lucide="bot" class="w-5 h-5"></i> Ask AI
                </button>
            </div>
            <div id="sentence-hint-box" class="hidden mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-xl text-yellow-800 text-sm slide-up shrink-0"></div>
        </section>

        <!-- QUIZ SECTION -->
        <section id="sec-quiz" class="hidden flex-1 flex flex-col fade-in">
             <div class="flex-1 flex flex-col justify-center min-h-[250px]">
                <h3 class="text-sm font-bold text-slate-400 mb-4 flex items-center gap-2 uppercase tracking-wider">
                    <i data-lucide="target" class="w-4 h-4"></i> Match Definition
                </h3>
                <div class="bg-emerald-50 p-6 sm:p-8 rounded-2xl border border-emerald-100 shadow-inner flex items-center justify-center text-center relative mb-8">
                    <p id="quiz-def" class="text-xl sm:text-2xl text-slate-800 font-medium italic z-10 leading-relaxed"></p>
                    <button onclick="speakText(quizQuestion.definition)" class="absolute bottom-2 right-2 text-emerald-600 p-2 rounded-full hover:bg-emerald-100 transition-colors">
                        <i data-lucide="volume-2" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div id="quiz-options" class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full mb-6 shrink-0">
                <!-- Options injected via JS -->
            </div>

            <div id="quiz-next-container" class="hidden justify-center w-full slide-up mb-6 shrink-0">
                <button onclick="loadQuizQuestion()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-10 rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2 text-base active:scale-95">
                    Next Question <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex justify-between items-center w-full border-t border-slate-100 pt-4 mt-auto shrink-0">
                <button id="btn-quiz-hint" onclick="getSmartHint()" class="flex items-center gap-2 px-4 py-2.5 bg-yellow-100 text-yellow-800 rounded-xl font-bold text-sm transition-colors active:scale-95 disabled:opacity-50">
                    <i data-lucide="lightbulb" class="w-4 h-4"></i> Get Hint
                </button>
                <button onclick="openChat()" class="flex items-center gap-2 bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-md transition-all text-sm active:scale-95">
                    <i data-lucide="bot" class="w-5 h-5"></i> Ask AI
                </button>
            </div>
            <div id="quiz-hint-box" class="hidden mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-xl text-yellow-800 text-sm slide-up shrink-0"></div>
        </section>

        <!-- SPELL SECTION -->
        <section id="sec-spell" class="hidden flex-1 flex flex-col fade-in">
             <div class="flex-1 flex flex-col items-center justify-center min-h-[300px]">
                <div class="flex items-center gap-4 mb-8">
                    <button onclick="speakText(spellQuestion.word)" class="p-5 rounded-full bg-blue-100 text-blue-600 hover:bg-blue-200 transition-colors shadow-inner active:scale-95">
                         <i data-lucide="volume-2" class="w-8 h-8"></i>
                    </button>
                    <p class="text-sm font-bold text-slate-500 uppercase tracking-widest">Listen & Spell</p>
                </div>

                <!-- Letter Boxes -->
                <div id="spell-boxes" class="flex flex-wrap justify-center gap-2 mb-8">
                    <!-- Boxes injected via JS -->
                </div>

                 <p id="spell-def" class="text-center text-slate-600 max-w-md mx-auto italic text-sm sm:text-base px-4"></p>
            </div>

            <!-- Virtual Keyboard -->
            <div id="virtual-keyboard" class="flex flex-wrap justify-center gap-1.5 sm:gap-2 mb-6 shrink-0 max-w-lg mx-auto">
                 <!-- Keys injected via JS -->
            </div>

            <div id="spell-feedback" class="hidden w-full p-4 rounded-xl flex justify-between items-center border mb-6 slide-up shrink-0">
                <span id="spell-feedback-text" class="font-bold text-sm sm:text-base"></span>
                <button onclick="loadSpellQuestion()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm active:scale-95">Next</button>
            </div>

            <div class="flex justify-between items-center w-full border-t border-slate-100 pt-4 mt-auto shrink-0">
                <div class="flex gap-2">
                    <button onclick="handleSpellBackspace()" class="p-2.5 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 active:scale-95"><i data-lucide="delete" class="w-5 h-5"></i></button>
                    <button onclick="revealSpellWord()" id="btn-spell-reveal" class="px-4 py-2.5 bg-rose-50 text-rose-600 rounded-xl font-bold text-sm hover:bg-rose-100 active:scale-95">Reveal</button>
                </div>
                <button onclick="openChat()" class="flex items-center gap-2 bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-md transition-all text-sm active:scale-95">
                    <i data-lucide="bot" class="w-5 h-5"></i> Ask AI
                </button>
            </div>
        </section>

    </main>

    <!-- Chat Modal -->
    <div id="chat-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50 transition-opacity">
        <div class="bg-white w-full h-[85vh] sm:h-[80vh] sm:max-w-md sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden slide-up sm:zoom-in rounded-t-3xl">
            
            <div class="bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white p-4 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="font-bold text-lg flex items-center gap-2">
                        <i data-lucide="bot" class="w-5 h-5"></i> Smart AI Tutor
                    </h3>
                    <p id="chat-context-subtitle" class="text-violet-100 text-xs font-medium"></p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-chat-speak-toggle" onclick="toggleAutoSpeakChat()" class="p-2 text-violet-600 bg-violet-100 rounded-full transition-colors flex items-center justify-center" title="Toggle Auto-Speak">
                        <i data-lucide="volume-2" class="w-4 h-4"></i>
                    </button>
                    <button onclick="closeChat()" class="p-2 hover:bg-white/20 rounded-full transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
            </div>

            <div id="chat-history" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 bg-slate-50">
                <!-- Chat messages injected here -->
            </div>

            <div class="p-3 bg-white border-t border-slate-100 flex gap-2 items-center shrink-0 pb-safe">
                <button id="btn-chat-mic" onclick="toggleChatRec()" class="p-3 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors active:scale-95">
                    <i data-lucide="mic" class="w-5 h-5"></i>
                </button>
                <input type="text" id="chat-input" placeholder="Ask a question..." class="flex-1 bg-slate-100 border-2 border-transparent focus:bg-white focus:border-violet-400 focus:ring-0 rounded-full px-4 py-2.5 text-sm font-medium outline-none transition-colors">
                <button onclick="sendChatMessage()" id="btn-chat-send" class="bg-violet-600 hover:bg-violet-700 text-white p-3 rounded-full shadow-sm transition-colors active:scale-95 disabled:bg-slate-300">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const vocabData = [
            { word: "privilege", definition: "a special benefit enjoyed only under certain circumstances", sentences: ["Driving a car is a _________, not a right.", "Having access to clean water is a _________.", "It was a huge _________ to meet the famous author.", "She had the _________ of choosing the colors."] },
            { word: "elegant", definition: "something that is high quality and fancy", sentences: ["She wore an _________ gown to the ball.", "The hotel lobby was very _________.", "He wrote an _________ math proof.", "The swan looked incredibly _________ on the lake."] },
            { word: "calculate", definition: "to determine the answer", sentences: ["We need to _________ the area.", "Please _________ the total cost.", "The computer can _________ complex equations.", "It's hard to _________ how much paint we need."] },
            { word: "grumble", definition: "to complain about something in a quiet voice", sentences: ["My stomach started to _________ loudly.", "He would always _________ about the weather.", "\"I hate waking up early,\" she began to _________.", "We heard the thunder _________."] },
            { word: "assemble", definition: "to put together", sentences: ["It took hours to _________ the furniture.", "The students will _________ in the auditorium.", "We must _________ a team of experts.", "They _________ thousands of cars daily."] },
            { word: "pledge", definition: "a promise or agreement to do or not to do something", sentences: ["We say the _________ of allegiance.", "The knights made a _________ of loyalty.", "Please _________ a small donation.", "I made a _________ to exercise every day."] },
            { word: "specific", definition: "to be particular or precise", sentences: ["Can you be more _________ about the time?", "This recipe needs a _________ type of flour.", "I need a _________ tool to fix this.", "She gave _________ details to the police."] },
            { word: "defend", definition: "to prove by giving evidence", sentences: ["The lawyer will _________ her client.", "The army must _________ the borders.", "You must _________ your argument with facts.", "He had to _________ his thesis."] },
            { word: "research", definition: "to study a specific subject", sentences: ["He needs to do more _________.", "Scientists are conducting new _________.", "I spent the afternoon doing _________ at the library.", "Medical _________ has advanced significantly."] },
            { word: "fragile", definition: "easily broken or damaged", sentences: ["Be careful with that glass, it is _________.", "The butterfly's wings look _________.", "The old documents are too _________ to touch.", "He felt emotionally _________."] }
        ];

        // --- STATE ---
        let studyList = [];
        let currentIndex = 0;
        let activeTab = 'study';
        let streak = 0;
        
        let sentenceQuestion = null;
        let sentenceResult = null;
        
        let quizQuestion = null;
        let quizResult = null;

        let spellQuestion = null;
        let spellInput = [];
        let spellResult = null; // null, 'correct', 'revealed'
        
        let chatHistory = [];
        let isChatLoading = false;
        let isAutoSpeakingChat = true;

        // Speech Recognition instances
        let practiceRec, sentenceRec, chatRec;
        let isPracticeRecording = false, isSentenceRecording = false, isChatRecording = false;
        let currentChatVal = "";

        // API Key handling (Assuming key is managed externally or via a backend proxy in real app)
        // For this demo, we will use a placeholder logic that fails gracefully if no key is provided.
        const GEMINI_API_KEY = ""; // REQUIRED FOR AI FEATURES

        // --- INITIALIZATION ---
        function init() {
            lucide.createIcons();
            shuffleStudyList();
            setupSpeechRecognition();
            loadSentenceQuestion();
            loadQuizQuestion();
            loadSpellQuestion();
            updateUI();
            
            // Enter key listeners
            document.getElementById('sentence-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkSentence(); });
            document.getElementById('chat-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChatMessage(); });
            
            // Safe area bottom padding for mobile
            if (CSS.supports('padding-bottom: env(safe-area-inset-bottom)')) {
                document.querySelector('.pb-safe').style.paddingBottom = 'calc(0.75rem + env(safe-area-inset-bottom))';
            }
        }

        // --- UTILS ---
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function updateStreak(won) {
            streak = won ? streak + 1 : 0;
            const el = document.getElementById('streak-counter');
            el.innerText = streak;
            if(won) {
                el.parentElement.classList.add('animate-[pulse_0.5s_ease-in-out_2]');
                setTimeout(() => el.parentElement.classList.remove('animate-[pulse_0.5s_ease-in-out_2]'), 1000);
            }
        }

        // --- CORE LOGIC ---
        function shuffleStudyList() {
            studyList = shuffleArray(vocabData);
            currentIndex = 0;
        }

        function currentWord() {
            return studyList[currentIndex];
        }

        function getCurrentContextItem() {
            if (activeTab === 'sentences' && sentenceQuestion) return sentenceQuestion;
            if (activeTab === 'quiz' && quizQuestion) return quizQuestion;
            if (activeTab === 'spell' && spellQuestion) return spellQuestion;
            return currentWord();
        }

        // --- STREAMING_CHUNK:Setting up Speech Recognition APIs... ---
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return; // Fallback handled gracefully by UI

            // Practice Rec
            practiceRec = new SpeechRecognition();
            practiceRec.continuous = false; practiceRec.interimResults = false;
            practiceRec.onstart = () => {
                isPracticeRecording = true;
                const btn = document.getElementById('btn-practice-mic');
                btn.classList.replace('bg-white', 'bg-rose-50'); btn.classList.replace('border-emerald-200', 'border-rose-500'); btn.classList.replace('text-emerald-600', 'text-rose-600');
                btn.innerHTML = `<i data-lucide="mic-off" class="mb-2 w-6 h-6 animate-pulse"></i><span class="font-bold text-sm">Stop</span>`; lucide.createIcons();
            };
            practiceRec.onresult = (e) => { checkPronunciation(e.results[0][0].transcript); };
            practiceRec.onend = practiceRec.onerror = () => {
                isPracticeRecording = false;
                const btn = document.getElementById('btn-practice-mic');
                btn.classList.replace('bg-rose-50', 'bg-white'); btn.classList.replace('border-rose-500', 'border-emerald-200'); btn.classList.replace('text-rose-600', 'text-emerald-600');
                btn.innerHTML = `<i data-lucide="mic" class="mb-2 w-6 h-6"></i><span class="font-bold text-sm">Pronounce</span>`; lucide.createIcons();
            };

            // Sentence Rec
            sentenceRec = new SpeechRecognition();
            sentenceRec.continuous = false; sentenceRec.interimResults = true;
            sentenceRec.onstart = () => { isSentenceRecording = true; document.getElementById('btn-sentence-mic').classList.replace('text-slate-500', 'text-rose-600'); };
            sentenceRec.onresult = (e) => { document.getElementById('sentence-input').value = Array.from(e.results).map(r => r[0].transcript).join(''); };
            sentenceRec.onend = sentenceRec.onerror = () => { isSentenceRecording = false; document.getElementById('btn-sentence-mic').classList.replace('text-rose-600', 'text-slate-500'); };

            // Chat Rec
            chatRec = new SpeechRecognition();
            chatRec.continuous = false; chatRec.interimResults = true;
            chatRec.onstart = () => { isChatRecording = true; document.getElementById('btn-chat-mic').classList.replace('text-slate-600', 'text-rose-600'); };
            chatRec.onresult = (e) => { document.getElementById('chat-input').value = Array.from(e.results).map(r => r[0].transcript).join(''); };
            chatRec.onend = chatRec.onerror = () => { isChatRecording = false; document.getElementById('btn-chat-mic').classList.replace('text-rose-600', 'text-slate-600'); };
        }

        function togglePracticeRec() { if(practiceRec) isPracticeRecording ? practiceRec.stop() : practiceRec.start(); }
        function toggleSentenceRec() { if(sentenceRec) isSentenceRecording ? sentenceRec.stop() : sentenceRec.start(); }
        function toggleChatRec() { if(chatRec) isChatRecording ? chatRec.stop() : chatRec.start(); }

        // --- STREAMING_CHUNK:Implementing Study & Quiz Logic... ---
        // UI Updates
        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`sec-${tabId}`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-white', 'text-indigo-700', 'shadow-sm');
                b.classList.add('text-white/80', 'hover:bg-white/10');
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            activeBtn.classList.remove('text-white/80', 'hover:bg-white/10');
            activeBtn.classList.add('bg-white', 'text-indigo-700', 'shadow-sm');
            
            window.speechSynthesis.cancel();
            updateUI();
        }

        function updateUI() {
            if(activeTab === 'study') {
                document.getElementById('study-word').innerText = currentWord().word;
                document.getElementById('study-def').innerText = currentWord().definition;
                document.getElementById('study-progress').innerText = `Card ${currentIndex + 1} of ${studyList.length}`;
                document.getElementById('pronounce-feedback').classList.add('hidden');
            }
        }

        function nextWord() { currentIndex = (currentIndex + 1) % studyList.length; updateUI(); }
        function prevWord() { currentIndex = (currentIndex - 1 + studyList.length) % studyList.length; updateUI(); }

        function checkPronunciation(transcript) {
            const cleanT = transcript.toLowerCase().replace(/[^a-z]/g, "");
            const cleanW = currentWord().word.toLowerCase().replace(/[^a-z]/g, "");
            const isCorrect = cleanT.includes(cleanW) || cleanT === cleanW;
            
            const fb = document.getElementById('pronounce-feedback');
            fb.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200');
            fb.classList.add(isCorrect ? 'bg-emerald-50' : 'bg-rose-50', isCorrect ? 'text-emerald-800' : 'text-rose-800', isCorrect ? 'border-emerald-200' : 'border-rose-200');
            
            fb.innerHTML = `
                <i data-lucide="${isCorrect ? 'check-circle' : 'x-circle'}" class="w-6 h-6 shrink-0 ${isCorrect ? 'text-emerald-500' : 'text-rose-500'}"></i>
                <div><p class="font-bold">${isCorrect ? 'Perfect pronunciation!' : 'Not quite right.'}</p><p class="text-xs opacity-80 mt-0.5">Heard: "${transcript}"</p></div>
            `;
            lucide.createIcons();
        }

        // Sentences
        function loadSentenceQuestion() {
            const w = vocabData[Math.floor(Math.random() * vocabData.length)];
            sentenceQuestion = { ...w, sentence: w.sentences[Math.floor(Math.random() * w.sentences.length)] };
            sentenceResult = null;
            
            document.getElementById('sentence-input').value = "";
            document.getElementById('sentence-input').disabled = false;
            document.getElementById('btn-sentence-mic').disabled = false;
            document.getElementById('btn-sentence-check').classList.remove('hidden');
            document.getElementById('btn-sentence-next').classList.add('hidden');
            document.getElementById('sentence-feedback').classList.add('hidden');
            document.getElementById('sentence-hint-box').classList.add('hidden');
            
            renderSentenceHtml();
        }

        function renderSentenceHtml() {
            const parts = sentenceQuestion.sentence.split('_________');
            const blankHTML = sentenceResult === 'correct' 
                ? `<span class="inline-block border-b-2 border-emerald-500 text-emerald-600 font-bold px-2 mx-1">${sentenceQuestion.word}</span>`
                : `<span class="inline-block border-b-2 border-slate-400 w-16 sm:w-24 mx-1"></span>`;
            document.getElementById('sentence-text').innerHTML = parts.join(blankHTML);
        }

        function checkSentence() {
            const val = document.getElementById('sentence-input').value.trim().toLowerCase();
            if(!val) return;
            
            const isCorrect = val === sentenceQuestion.word.toLowerCase();
            sentenceResult = isCorrect ? 'correct' : 'incorrect';
            updateStreak(isCorrect);
            
            document.getElementById('sentence-input').disabled = true;
            document.getElementById('btn-sentence-mic').disabled = true;
            document.getElementById('btn-sentence-check').classList.add('hidden');
            document.getElementById('btn-sentence-next').classList.remove('hidden');
            
            const fb = document.getElementById('sentence-feedback');
            fb.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200', 'bg-rose-50', 'text-rose-700', 'border-rose-200');
            fb.classList.add(isCorrect ? 'bg-emerald-50' : 'bg-rose-50', isCorrect ? 'text-emerald-700' : 'text-rose-700', isCorrect ? 'border-emerald-200' : 'border-rose-200');
            fb.innerHTML = `
                <i data-lucide="${isCorrect ? 'check-circle' : 'x-circle'}" class="w-6 h-6 shrink-0 ${isCorrect ? 'text-emerald-500' : 'text-rose-500'}"></i>
                <span>${isCorrect ? 'Correct! Keep the streak going!' : `Incorrect. The correct word is "${sentenceQuestion.word}".`}</span>
            `;
            lucide.createIcons();
            renderSentenceHtml();
        }

        // Quiz
        function loadQuizQuestion() {
            const target = vocabData[Math.floor(Math.random() * vocabData.length)];
            let options = [target.word];
            while(options.length < 4) {
                const r = vocabData[Math.floor(Math.random() * vocabData.length)].word;
                if(!options.includes(r)) options.push(r);
            }
            quizQuestion = { word: target.word, definition: target.definition, options: shuffleArray(options) };
            quizResult = null;
            
            document.getElementById('quiz-def').innerText = `"${quizQuestion.definition}"`;
            document.getElementById('quiz-next-container').classList.add('hidden');
            document.getElementById('quiz-hint-box').classList.add('hidden');
            renderQuizOptions();
        }

        function renderQuizOptions() {
            const container = document.getElementById('quiz-options');
            container.innerHTML = '';
            quizQuestion.options.forEach(opt => {
                let style = "bg-white border-slate-200 text-slate-700 hover:border-emerald-400 hover:bg-emerald-50 cursor-pointer";
                if (quizResult !== null) {
                    if (opt === quizQuestion.word) style = "bg-emerald-500 border-emerald-600 text-white shadow-md scale-[1.02] cursor-default";
                    else if (opt === quizResult) style = "bg-rose-500 border-rose-600 text-white shadow-inner cursor-default";
                    else style = "bg-slate-100 border-slate-200 text-slate-400 opacity-60 cursor-default";
                }
                container.innerHTML += `<button onclick="checkQuiz('${opt}')" ${quizResult !== null ? 'disabled' : ''} class="p-4 rounded-xl border-2 text-lg font-bold capitalize transition-all shadow-sm flex items-center justify-center ${style}">${opt}</button>`;
            });
        }

        function checkQuiz(selected) {
            if(quizResult !== null) return;
            quizResult = selected;
            const isCorrect = selected === quizQuestion.word;
            updateStreak(isCorrect);
            renderQuizOptions();
            document.getElementById('quiz-next-container').classList.remove('hidden');
        }

        // --- STREAMING_CHUNK:Implementing Spelling Section Logic... ---
        // Spell
        function loadSpellQuestion() {
            const target = vocabData[Math.floor(Math.random() * vocabData.length)];
            spellQuestion = target;
            spellInput = [];
            spellResult = null;
            
            document.getElementById('spell-def').innerText = `"${target.definition}"`;
            document.getElementById('spell-feedback').classList.add('hidden');
            document.getElementById('btn-spell-reveal').disabled = false;
            
            renderSpellBoxes();
            renderKeyboard();
            speakText(target.word);
        }

        function renderSpellBoxes() {
            const container = document.getElementById('spell-boxes');
            container.innerHTML = '';
            const targetWord = spellQuestion.word;
            
            for(let i=0; i<targetWord.length; i++) {
                let char = spellInput[i] || '';
                let statusClass = '';
                
                if (spellResult === 'correct') statusClass = 'correct';
                else if (spellResult === 'revealed') {
                    char = targetWord[i];
                    statusClass = 'revealed';
                } else if (char) statusClass = 'filled';

                container.innerHTML += `<div class="letter-box ${statusClass}">${char}</div>`;
            }
        }

        function renderKeyboard() {
            const container = document.getElementById('virtual-keyboard');
            container.innerHTML = '';
            const row1 = "QWERTYUIOP".split('');
            const row2 = "ASDFGHJKL".split('');
            const row3 = "ZXCVBNM".split('');
            
            const createKeys = (row) => {
                 let html = `<div class="flex justify-center gap-1.5 sm:gap-2 w-full">`;
                 row.forEach(key => {
                    html += `<button onclick="handleSpellKey('${key}')" ${spellResult ? 'disabled' : ''} class="w-8 h-10 sm:w-10 sm:h-12 bg-white border border-slate-200 rounded text-slate-800 font-bold hover:bg-slate-100 active:bg-slate-200 active:scale-95 transition-all shadow-sm ${spellResult ? 'opacity-50' : ''}">${key}</button>`;
                 });
                 html += `</div>`;
                 return html;
            }
            container.innerHTML = createKeys(row1) + createKeys(row2) + createKeys(row3);
        }

        function handleSpellKey(char) {
            if (spellResult || spellInput.length >= spellQuestion.word.length) return;
            spellInput.push(char.toLowerCase());
            renderSpellBoxes();
            
            if (spellInput.length === spellQuestion.word.length) {
                checkSpellWord();
            }
        }

        function handleSpellBackspace() {
            if (spellResult || spellInput.length === 0) return;
            spellInput.pop();
            renderSpellBoxes();
        }

        function checkSpellWord() {
            const entered = spellInput.join('');
            if (entered === spellQuestion.word.toLowerCase()) {
                spellResult = 'correct';
                updateStreak(true);
                showSpellFeedback('correct', 'Perfect spelling!');
            } else {
                updateStreak(false);
                showSpellFeedback('incorrect', 'Not quite! Keep trying.');
                setTimeout(() => {
                    if(spellResult !== 'revealed') {
                         spellInput = [];
                         spellResult = null;
                         renderSpellBoxes();
                         document.getElementById('spell-feedback').classList.add('hidden');
                    }
                }, 1500);
            }
            renderSpellBoxes();
            renderKeyboard();
        }

        function revealSpellWord() {
            spellResult = 'revealed';
            updateStreak(false);
            showSpellFeedback('revealed', `The word was: ${spellQuestion.word}`);
            document.getElementById('btn-spell-reveal').disabled = true;
            renderSpellBoxes();
            renderKeyboard();
        }

        function showSpellFeedback(status, msg) {
            const fb = document.getElementById('spell-feedback');
            fb.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-amber-50', 'text-amber-800', 'border-amber-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200');
            
            let icon = '';
            if(status === 'correct') { fb.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200'); icon = '<i data-lucide="check-circle" class="w-5 h-5 text-emerald-500"></i>'; }
            else if(status === 'revealed') { fb.classList.add('bg-amber-50', 'text-amber-800', 'border-amber-200'); icon = '<i data-lucide="info" class="w-5 h-5 text-amber-500"></i>'; }
            else { fb.classList.add('bg-rose-50', 'text-rose-800', 'border-rose-200'); icon = '<i data-lucide="x-circle" class="w-5 h-5 text-rose-500"></i>'; }

            document.getElementById('spell-feedback-text').innerHTML = `<span class="flex items-center gap-2">${icon} ${msg}</span>`;
            lucide.createIcons();
        }

        // --- STREAMING_CHUNK:Implementing Smart AI Chat & Hints... ---
        // AI Integration
        async function getSmartHint() {
            const contextItem = getCurrentContextItem();
            const btnId = activeTab === 'sentences' ? 'btn-sentence-hint' : 'btn-quiz-hint';
            const boxId = activeTab === 'sentences' ? 'sentence-hint-box' : 'quiz-hint-box';
            
            const btn = document.getElementById(btnId);
            const box = document.getElementById(boxId);
            
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Thinking...`;
            lucide.createIcons();

            let prompt = "";
            if (activeTab === 'sentences') {
                prompt = `Student needs help filling the blank in: "${contextItem.sentence}". Target word: "${contextItem.word}". Provide ONE extremely clever, subtle sentence hinting at the answer WITHOUT using any form of the target word.`;
            } else {
                prompt = `Student is matching a word to definition: "${contextItem.definition}". Target word: "${contextItem.word}". Provide a fun 1-sentence mnemonic or scenario that hints at the word without saying it.`;
            }

            try {
                if(!GEMINI_API_KEY) throw new Error("API key missing. AI features disabled for preview.");
                
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt}]}] })
                });
                const data = await res.json();
                const hint = data.candidates?.[0]?.content?.parts?.[0]?.text || "Think about the general concept of the sentence.";
                
                box.innerHTML = `<strong>Smart Hint:</strong> ${hint}`;
                box.classList.remove('hidden');
            } catch (e) {
                box.innerHTML = `<strong>Note:</strong> Set GEMINI_API_KEY in code to enable AI hints. Default hint: Think about synonyms.`;
                box.classList.remove('hidden');
            } finally {
                btn.innerHTML = `<i data-lucide="lightbulb" class="w-4 h-4 text-yellow-500"></i> Hint Shown`;
                lucide.createIcons();
            }
        }

        // Chat Modals
        function openChat() {
            document.getElementById('chat-modal').classList.remove('hidden');
            document.getElementById('chat-context-subtitle').innerText = `Discussing: ${getCurrentContextItem().word}`;
            
            if (chatHistory.length === 0 || chatHistory[chatHistory.length-1].contextWord !== getCurrentContextItem().word) {
                resetChatContext();
            }
        }

        function closeChat() {
            document.getElementById('chat-modal').classList.add('hidden');
            window.speechSynthesis.cancel();
        }

        function toggleAutoSpeakChat() {
            isAutoSpeakingChat = !isAutoSpeakingChat;
            const btn = document.getElementById('btn-chat-speak-toggle');
            if(isAutoSpeakingChat) btn.classList.replace('text-slate-400', 'text-violet-600'), btn.classList.replace('bg-slate-100', 'bg-violet-100');
            else btn.classList.replace('text-violet-600', 'text-slate-400'), btn.classList.replace('bg-violet-100', 'bg-slate-100'), window.speechSynthesis.cancel();
        }

        function resetChatContext() {
            const item = getCurrentContextItem();
            let initMsg = `Hi! Let's talk about **${item.word}**. Need an example?`;
            
            if (activeTab === 'sentences') initMsg = `Stuck on the sentence for **${item.word}**? I can explain what type of word belongs there!`;
            else if (activeTab === 'quiz') initMsg = `Trying to find the word that means "${item.definition}"? Tell me what you're guessing!`;
            else if (activeTab === 'spell') initMsg = `Need a trick to remember how to spell **${item.word}**?`;

            chatHistory = [{ role: "model", parts: [{ text: initMsg }], contextWord: item.word }];
            renderChatHistory();
            if(isAutoSpeakingChat) speakText(initMsg.replace(/\*/g, ''));
        }

        function renderChatHistory() {
            const container = document.getElementById('chat-history');
            container.innerHTML = '';
            
            chatHistory.forEach(msg => {
                const isUser = msg.role === 'user';
                const text = msg.parts[0].text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                const div = document.createElement('div');
                div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} slide-up`;
                div.innerHTML = `<div class="max-w-[85%] p-3.5 rounded-2xl text-[15px] shadow-sm leading-relaxed ${isUser ? 'bg-violet-500 text-white rounded-tr-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-tl-sm'}">${text}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const val = input.value.trim();
            if(!val || isChatLoading) return;

            input.value = '';
            chatHistory.push({ role: "user", parts: [{ text: val }], contextWord: getCurrentContextItem().word });
            renderChatHistory();
            
            isChatLoading = true;
            document.getElementById('btn-chat-send').disabled = true;
            document.getElementById('btn-chat-send').innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>`;
            lucide.createIcons();

            try {
                if(!GEMINI_API_KEY) throw new Error("API key missing.");
                
                const sysPrompt = `You are a warm, highly intelligent English tutor. The student is currently practicing the word "${getCurrentContextItem().word}" (${getCurrentContextItem().definition}). Actively guide them based on the tab they are on (${activeTab}). Keep responses to 1-2 very short sentences. Use bolding for emphasis.`;
                
                // Filter out non-api fields before sending
                const payloadContent = chatHistory.map(m => ({role: m.role, parts: m.parts}));

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: payloadContent, systemInstruction: {parts:[{text: sysPrompt}]} })
                });
                const data = await res.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "I'm here to help!";
                
                chatHistory.push({ role: "model", parts: [{ text: reply }], contextWord: getCurrentContextItem().word });
                renderChatHistory();
                if(isAutoSpeakingChat) speakText(reply.replace(/\*/g, ''));
                
            } catch (e) {
                chatHistory.push({ role: "model", parts: [{ text: "API Key required for AI responses. Set GEMINI_API_KEY in code." }], contextWord: getCurrentContextItem().word });
                renderChatHistory();
            } finally {
                isChatLoading = false;
                document.getElementById('btn-chat-send').disabled = false;
                document.getElementById('btn-chat-send').innerHTML = `<i data-lucide="send" class="w-5 h-5"></i>`;
                lucide.createIcons();
            }
        }

        // Boot app
        window.onload = init;
    </script>
</body>
</html>
